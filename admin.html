<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Craftio Gifts - Admin Login</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7f9;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 90%;
      max-width: 380px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 27px;
    }

    h1 span {
      color: #00aef0;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: #00aef0;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #00aef0;
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: #008fc5;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
      font-size: 13px;
    }

  </style>

</head>

<body>

  <div class="login-box">

    <h1>
      CRAFTIO <span>GIFTS</span>
    </h1>

    <div class="subtitle">
      Admin Login
    </div>


    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter admin email">


    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter password">


    <button
      id="loginBtn"
      onclick="login()">

      LOGIN

    </button>


    <div id="message"></div>

  </div>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://hujwsdixdxhofwhibjff.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_cdGRvXXS3R663XWC6ZjgaQ_s1LuK2hf";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       LOGIN
    ========================= */

    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const button =
        document.getElementById("loginBtn");

      const message =
        document.getElementById("message");


      if (!email || !password) {

        message.style.color = "#d33";

        message.textContent =
          "Please enter email and password.";

        return;

      }


      button.disabled = true;

      button.textContent =
        "LOGGING IN...";

      message.style.color = "#777";

      message.textContent =
        "Please wait...";


      try {

        const { data, error } =
          await supabaseClient
            .auth
            .signInWithPassword({

              email: email,

              password: password

            });


        if (error) {

          message.style.color = "#d33";

          message.textContent =
            error.message;

          button.disabled = false;

          button.textContent = "LOGIN";

          return;

        }


        /* =========================
           CHECK ADMIN
        ========================= */

        const { data: admin, error: adminError } =
          await supabaseClient
            .from("admin_users")
            .select("user_id, role")
            .eq("user_id", data.user.id)
            .maybeSingle();


        if (adminError) {

          message.style.color = "#d33";

          message.textContent =
            adminError.message;

          button.disabled = false;

          button.textContent = "LOGIN";

          return;

        }


        if (!admin || admin.role !== "admin") {

          await supabaseClient
            .auth
            .signOut();

          message.style.color = "#d33";

          message.textContent =
            "This account is not an admin.";

          button.disabled = false;

          button.textContent = "LOGIN";

          return;

        }


        message.style.color = "#079455";

        message.textContent =
          "LOGIN SUCCESSFUL ✅";

        button.textContent =
          "SUCCESS";


      } catch (error) {

        message.style.color = "#d33";

        message.textContent =
          "Connection error: " +
          error.message;

        button.disabled = false;

        button.textContent =
          "LOGIN";

      }

    }

  </script>

</body>
</html>
