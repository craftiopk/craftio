<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Craftio Gifts - Admin Login</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #00aef0;
    }

    .logo p {
      color: #777;
      font-size: 14px;
      margin-top: 8px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    .field input:focus {
      border-color: #00aef0;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #00aef0;
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #008fc5;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
      font-size: 13px;
    }

  </style>

</head>

<body>

  <div class="login-box">

    <div class="logo">

      <h1>
        CRAFTIO <span>GIFTS</span>
      </h1>

      <p>
        Admin Login
      </p>

    </div>


    <div class="field">

      <label>
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email">

    </div>


    <div class="field">

      <label>
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password">

    </div>


    <button
      class="login-btn"
      id="loginBtn"
      onclick="login()">

      LOGIN

    </button>


    <div id="message"></div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://juguwyfvgogqkucbcrcx.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_uxvucsvP7SDhLMqCEhCIpA_B684g00i";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    async function login() {

      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const message =
        document
          .getElementById("message");


      const button =
        document
          .getElementById("loginBtn");


      if (!email || !password) {

        message.style.color = "#d33";

        message.textContent =
          "Email and password required.";

        return;

      }


      button.disabled = true;

      button.textContent =
        "LOGGING IN...";

      message.style.color =
        "#777";

      message.textContent =
        "Please wait...";


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .signInWithPassword({

              email:
                email,

              password:
                password

            });


        if (error) {

          message.style.color =
            "#d33";

          message.textContent =
            error.message;

          button.disabled =
            false;

          button.textContent =
            "LOGIN";

          return;

        }


        const user =
          data.user;


        const {
          data: admin,
          error: adminError
        } =
          await supabaseClient

            .from("admin_users")

            .select(
              "user_id, role"
            )

            .eq(
              "user_id",
              user.id
            )

            .maybeSingle();


        if (adminError) {

          message.style.color =
            "#d33";

          message.textContent =
            adminError.message;

          button.disabled =
            false;

          button.textContent =
            "LOGIN";

          return;

        }


        if (
          !admin ||
          admin.role !== "admin"
        ) {

          await supabaseClient
            .auth
            .signOut();


          message.style.color =
            "#d33";

          message.textContent =
            "This account is not an admin.";

          button.disabled =
            false;

          button.textContent =
            "LOGIN";

          return;

        }


        message.style.color =
          "#079455";

        message.textContent =
          "Login successful!";


        button.textContent =
          "SUCCESS";


      } catch (error) {

        message.style.color =
          "#d33";

        message.textContent =
          "Connection error: " +
          error.message;


        button.disabled =
          false;

        button.textContent =
          "LOGIN";

      }

    }

  </script>

</body>

</html>
