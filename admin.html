<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Admin Panel | Craftio Gifts</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f9;
      color: #111;
    }

    button,
    input,
    select {
      font: inherit;
    }


    /* =========================
       LOGIN
    ========================= */

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 410px;
      background: #fff;
      padding: 35px;
      border-radius: 18px;
      box-shadow:
        0 15px 45px rgba(0,0,0,0.10);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo h1 {
      font-size: 28px;
      letter-spacing: 1px;
    }

    .login-logo h1 span {
      color: #00aef0;
    }

    .login-logo p {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      outline: none;
      background: #fff;
      font-size: 14px;
    }

    .field input:focus,
    .field select:focus {
      border-color: #00aef0;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #00aef0;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #008fc5;
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .login-message {
      min-height: 20px;
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
    }


    /* =========================
       ADMIN APP
    ========================= */

    .admin-app {
      display: none;
      min-height: 100vh;
    }

    .admin-app.active {
      display: block;
    }


    /* =========================
       TOPBAR
    ========================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: #111;
      color: #fff;

      padding: 16px 5%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand span {
      color: #00aef0;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-btn {
      padding: 9px 13px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
    }

    .website-btn {
      background: #00aef0;
      color: #fff;
    }

    .website-btn:hover {
      background: #008fc5;
    }

    .logout-btn {
      background: #fff;
      color: #111;
    }


    /* =========================
       MAIN
    ========================= */

    .container {
      max-width: 1250px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    .page-heading h1 {
      font-size: 31px;
    }

    .product-count {
      margin-top: 6px;
      color: #777;
      font-size: 13px;
    }

    .heading-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .add-product-btn,
    .manage-categories-btn {
      border: none;
      border-radius: 9px;
      padding: 12px 17px;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .add-product-btn {
      background: #00aef0;
    }

    .add-product-btn:hover {
      background: #008fc5;
    }

    .manage-categories-btn {
      background: #111;
    }

    .manage-categories-btn:hover {
      background: #333;
    }


    /* =========================
       STATUS
    ========================= */

    .status {
      display: none;

      background: #eaf9ff;
      color: #008fc5;

      padding: 12px;
      border-radius: 9px;

      margin-bottom: 15px;

      text-align: center;

      font-size: 13px;
      font-weight: 700;
    }

    .status.show {
      display: block;
    }


    /* =========================
       TOOLBAR
    ========================= */

    .toolbar {
      background: #fff;

      padding: 15px;

      border-radius: 13px;

      box-shadow:
        0 7px 25px rgba(0,0,0,0.05);

      display: flex;

      gap: 10px;

      margin-bottom: 20px;
    }

    .toolbar input,
    .toolbar select {
      padding: 11px 12px;

      border: 1px solid #ddd;

      border-radius: 9px;

      outline: none;

      background: #fff;

      font-size: 13px;
    }

    .toolbar input {
      flex: 1;
    }

    .toolbar select {
      min-width: 240px;
    }


    /* =========================
       PRODUCT GRID
    ========================= */

    .products-list {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(310px, 1fr));

      gap: 20px;
    }


    /* =========================
       PRODUCT CARD
    ========================= */

    .product-card {
      background: #fff;

      border-radius: 15px;

      overflow: hidden;

      box-shadow:
        0 7px 25px rgba(0,0,0,0.05);

      position: relative;
    }

    .product-card.hidden-product {
      opacity: 0.58;
    }

    .product-image {
      width: 100%;
      height: 225px;

      background: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      border-bottom: 1px solid #eee;
    }

    .product-image img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      padding: 10px;

      display: block;
    }

    .no-image {
      color: #999;
      font-size: 13px;
    }

    .hidden-badge {
      position: absolute;

      top: 10px;
      left: 10px;

      background: #666;
      color: #fff;

      padding: 6px 9px;

      border-radius: 999px;

      font-size: 10px;

      font-weight: 800;
    }

    .sale-badge {
      position: absolute;

      top: 10px;
      right: 10px;

      background: #00aef0;
      color: #fff;

      padding: 6px 9px;

      border-radius: 999px;

      font-size: 10px;

      font-weight: 800;
    }

    .product-body {
      padding: 17px;
    }

    .product-body h3 {
      font-size: 16px;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .category-display {
      color: #008fc5;

      font-size: 11px;

      font-weight: 800;

      margin-bottom: 15px;
    }

    .edit-field {
      margin-bottom: 11px;
    }

    .edit-field label {
      display: block;

      margin-bottom: 5px;

      font-size: 11px;

      font-weight: 800;
    }

    .edit-field input,
    .edit-field select {
      width: 100%;

      padding: 9px;

      border: 1px solid #ddd;

      border-radius: 7px;

      outline: none;

      background: #fff;

      font-size: 12px;
    }

    .two-column {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;
    }

    .sale-row {
      display: flex;

      align-items: center;

      gap: 7px;

      margin: 5px 0 12px;

      font-size: 12px;

      font-weight: 700;
    }

    .sale-row input {
      width: auto;
    }


    /* =========================
       ACTION BUTTONS
    ========================= */

    .action-row {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      margin-top: 8px;
    }

    .save-btn,
    .hide-btn,
    .delete-btn {
      border: none;

      border-radius: 7px;

      padding: 10px;

      cursor: pointer;

      font-size: 11px;

      font-weight: 800;
    }

    .save-btn {
      background: #111;
      color: #fff;
    }

    .save-btn:hover {
      background: #333;
    }

    .hide-btn {
      background: #eef8fc;
      color: #008fc5;
    }

    .delete-btn {
      grid-column: 1 / -1;

      background: #ffecec;

      color: #d33;
    }


    /* =========================
       IMAGE UPLOAD
    ========================= */

    .upload-label {
      display: block;

      padding: 9px;

      text-align: center;

      border: 1px dashed #aaa;

      border-radius: 7px;

      color: #666;

      cursor: pointer;

      font-size: 11px;

      font-weight: 700;

      margin-bottom: 10px;
    }

    .upload-label:hover {
      border-color: #00aef0;
      color: #00aef0;
    }

    .upload-input {
      display: none;
    }


    /* =========================
       EMPTY
    ========================= */

    .empty-products {
      grid-column: 1 / -1;

      background: #fff;

      border-radius: 15px;

      padding: 60px 20px;

      text-align: center;

      color: #777;
    }


    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;

      inset: 0;

      background: rgba(0,0,0,0.55);

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      z-index: 5000;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;

      max-width: 500px;

      max-height: 90vh;

      overflow-y: auto;

      background: #fff;

      border-radius: 15px;

      padding: 25px;
    }

    .category-modal-box {
      max-width: 650px;
    }

    .modal-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 22px;
    }

    .close-modal {
      border: none;

      background: none;

      font-size: 28px;

      cursor: pointer;
    }

    .create-btn {
      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 8px;

      background: #00aef0;

      color: #fff;

      font-weight: 800;

      cursor: pointer;

      margin-top: 5px;
    }

    .create-btn:hover {
      background: #008fc5;
    }


    /* =========================
       CATEGORY MANAGEMENT
    ========================= */

    .category-add-row {
      display: grid;

      grid-template-columns:
        1fr auto;

      gap: 10px;

      margin-bottom: 20px;
    }

    .category-add-row input {
      width: 100%;

      padding: 11px 12px;

      border: 1px solid #ddd;

      border-radius: 9px;

      outline: none;

      font-size: 13px;
    }

    .category-add-row input:focus {
      border-color: #00aef0;
    }

    .category-add-btn {
      border: none;

      border-radius: 9px;

      padding: 11px 16px;

      background: #00aef0;

      color: #fff;

      font-size: 12px;

      font-weight: 800;

      cursor: pointer;

      white-space: nowrap;
    }

    .category-add-btn:hover {
      background: #008fc5;
    }

    .category-list {
      display: flex;

      flex-direction: column;

      gap: 9px;
    }

    .category-item {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      padding: 11px 12px;

      border: 1px solid #eee;

      border-radius: 9px;

      background: #fafafa;
    }

    .category-name {
      font-size: 13px;

      font-weight: 700;

      line-height: 1.4;

      word-break: break-word;
    }

    .category-actions {
      display: flex;

      align-items: center;

      gap: 7px;

      flex-shrink: 0;
    }

    .category-edit-btn,
    .category-delete-btn {
      border: none;

      border-radius: 7px;

      padding: 7px 10px;

      font-size: 10px;

      font-weight: 800;

      cursor: pointer;
    }

    .category-edit-btn {
      background: #111;

      color: #fff;
    }

    .category-edit-btn:hover {
      background: #333;
    }

    .category-delete-btn {
      background: #ffecec;

      color: #d33;
    }

    .category-empty {
      padding: 25px;

      border: 1px dashed #ccc;

      border-radius: 9px;

      text-align: center;

      color: #777;

      font-size: 13px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .topbar {
        padding: 13px 15px;
      }

      .brand {
        font-size: 19px;
      }

      .top-btn {
        padding: 8px;
        font-size: 10px;
      }

      .container {
        padding: 25px 12px 50px;
      }

      .page-heading {
        flex-direction: column;
        align-items: stretch;
      }

      .heading-actions {
        display: grid;
        grid-template-columns: 1fr;
        width: 100%;
      }

      .add-product-btn,
      .manage-categories-btn {
        width: 100%;
      }

      .toolbar {
        flex-direction: column;
      }

      .toolbar select {
        width: 100%;
        min-width: 0;
      }

      .products-list {
        grid-template-columns: 1fr;
      }

      .two-column {
        grid-template-columns: 1fr;
      }

      .product-image {
        height: 250px;
      }

      .category-add-row {
        grid-template-columns: 1fr;
      }

      .category-add-btn {
        width: 100%;
      }

      .category-item {
        align-items: flex-start;
      }

      .category-actions {
        flex-direction: column;
      }

    }

  </style>

</head>


<body>


  <!-- =================================
       LOGIN
  ================================= -->

  <div
    class="login-screen"
    id="loginScreen">


    <div class="login-box">


      <div class="login-logo">

        <h1>
          CRAFTIO <span>GIFTS</span>
        </h1>

        <p>
          Admin Panel
        </p>

      </div>


      <div class="field">

        <label>
          Email
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="Admin email">

      </div>


      <div class="field">

        <label>
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Password">

      </div>


      <button
        class="login-btn"
        id="loginButton"
        onclick="login()">

        LOGIN

      </button>


      <div
        class="login-message"
        id="loginMessage">
      </div>


    </div>

  </div>


  <!-- =================================
       ADMIN
  ================================= -->

  <div
    class="admin-app"
    id="adminApp">


    <div class="topbar">


      <div class="brand">

        CRAFTIO
        <span>GIFTS</span>

      </div>


      <div class="top-actions">


        <a
          href="index.html"
          class="top-btn website-btn">

          WEBSITE

        </a>


        <button
          class="top-btn logout-btn"
          onclick="logout()">

          LOGOUT

        </button>


      </div>


    </div>


    <main class="container">


      <div class="page-heading">


        <div>

          <h1>
            Products
          </h1>

          <div
            class="product-count"
            id="productCount">

            Loading...

          </div>

        </div>


        <div class="heading-actions">


          <button
            class="manage-categories-btn"
            onclick="openCategoryModal()">

            MANAGE CATEGORIES

          </button>


          <button
            class="add-product-btn"
            onclick="openCreateModal()">

            + ADD PRODUCT

          </button>


        </div>


      </div>


      <div
        class="status"
        id="statusBox">
      </div>


      <!-- SEARCH -->

      <div class="toolbar">


        <input
          type="search"
          id="searchProducts"
          placeholder="Search product..."
          oninput="renderProducts()">


        <select
          id="categoryFilter"
          onchange="renderProducts()">

          <option value="ALL">
            ALL CATEGORIES
          </option>

        </select>


      </div>


      <!-- PRODUCTS -->

      <div
        class="products-list"
        id="productsList">
      </div>


    </main>


  </div>


  <!-- =================================
       ADD PRODUCT MODAL
  ================================= -->

  <div
    class="modal"
    id="createModal"
    onclick="closeModalOutside(event)">


    <div class="modal-box">


      <div class="modal-header">


        <h2>
          Add Product
        </h2>


        <button
          class="close-modal"
          onclick="closeCreateModal()">

          ×

        </button>


      </div>


      <div class="field">

        <label>
          Product Name
        </label>

        <input
          type="text"
          id="newName"
          placeholder="Enter product name">

      </div>


      <div class="field">

        <label>
          Category
        </label>

        <select
          id="newCategory">
        </select>

      </div>


      <div class="two-column">


        <div class="field">

          <label>
            Price
          </label>

          <input
            type="number"
            min="0"
            id="newPrice"
            value="0">

        </div>


        <div class="field">

          <label>
            Sale Price
          </label>

          <input
            type="number"
            min="0"
            id="newSalePrice"
            placeholder="Optional">

        </div>


      </div>


      <div class="sale-row">

        <input
          type="checkbox"
          id="newSale">

        <label for="newSale">
          Sale Active
        </label>

      </div>


      <div class="field">

        <label>
          Product Image
        </label>

        <input
          type="file"
          id="newImage"
          accept="image/*">

      </div>


      <button
        class="create-btn"
        onclick="createProduct()">

        ADD PRODUCT

      </button>


    </div>

  </div>


  <!-- =================================
       CATEGORY MANAGEMENT MODAL
  ================================= -->

  <div
    class="modal"
    id="categoryModal"
    onclick="closeCategoryModalOutside(event)">


    <div
      class="modal-box category-modal-box">


      <div class="modal-header">


        <h2>
          Categories Management
        </h2>


        <button
          class="close-modal"
          onclick="closeCategoryModal()">

          ×

        </button>


      </div>


      <div class="category-add-row">


        <input
          type="text"
          id="newCategoryName"
          placeholder="Enter new category name">


        <button
          class="category-add-btn"
          onclick="addCategory()">

          + ADD CATEGORY

        </button>


      </div>


      <div
        class="category-list"
        id="categoryList">
      </div>


    </div>

  </div>


  <script>


    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://hujwsdixdxhofwhibjff.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_cdGRvXXS3R663XWC6ZjgaQ_s1LuK2hf";


    const supabaseClient =
      window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY

      );


    /* =====================================
       DEFAULT CATEGORIES
    ===================================== */

    const defaultCategories = [

      "ISLAMIC COLLECTION",

      "LED PICTURE FRAME",

      "ANNIVERSARY FRAMES",

      "NIKKAH FRAMES",

      "BIRTHDAY FRAMES",

      "PICTURE FRAMES",

      "MUG COLLECTION",

      "MAGIC MUGS",

      "NEW BORN FRAMES",

      "SNAPCHAT / TIKTOK / INSTAGRAM PVC CARDS",

      "FRIENDSHIP LICENCE CARD",

      "EYE NECKLACE",

      "WEDDING RING PLATES",

      "TRENDY CHARTS",

      "NAME KEYCHAINS",

      "PVC CARD",

      "MAGIC LAMPS"

    ];


    let categories = [

      ...defaultCategories

    ];


    let products = [];


    /* =====================================
       LOAD CATEGORIES
    ===================================== */

    async function loadCategories() {


      const {
        data,
        error
      } =
        await supabaseClient

          .from(
            "categories"
          )

          .select(
            "id, name"
          )

          .eq(
            "active",
            true
          )

          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "Categories load error:",
          error
        );


        categories =
          [
            ...defaultCategories
          ];


        setupCategorySelects();


        renderCategoryList();


        showStatus(
          "Could not load categories table. Using default categories."
        );


        return;

      }


      categories =
        (data || [])
          .map(
            function(item) {

              return String(
                item.name || ""
              ).trim();

            }
          )
          .filter(
            function(name) {

              return !!name;

            }
          );


      setupCategorySelects();


      renderCategoryList();

    }


    /* =====================================
       SETUP CATEGORY SELECTS
    ===================================== */

    function setupCategorySelects() {


      const filter =
        document.getElementById(
          "categoryFilter"
        );


      const newCategory =
        document.getElementById(
          "newCategory"
        );


      const currentFilter =
        filter.value;


      filter.innerHTML = `

        <option value="ALL">
          ALL CATEGORIES
        </option>

      `;


      categories.forEach(
        function(category) {


          const option =
            document.createElement(
              "option"
            );


          option.value =
            category;


          option.textContent =
            category;


          filter.appendChild(
            option
          );


        }
      );


      if (
        currentFilter === "ALL" ||
        categories.includes(
          currentFilter
        )
      ) {

        filter.value =
          currentFilter;

      } else {

        filter.value =
          "ALL";

      }


      const currentNewCategory =
        newCategory.value;


      newCategory.innerHTML =
        "";


      categories.forEach(
        function(category) {


          const option =
            document.createElement(
              "option"
            );


          option.value =
            category;


          option.textContent =
            category;


          newCategory.appendChild(
            option
          );


        }
      );


      if (
        categories.includes(
          currentNewCategory
        )
      ) {

        newCategory.value =
          currentNewCategory;

      } else if (
        categories.length > 0
      ) {

        newCategory.value =
          categories[0];

      }

    }


    /* =====================================

      } =

    /* =====================================
       EDIT CATEGORY
    ===================================== */

    async function editCategory(
      oldName
    ) {


      const newNameInput =
        prompt(
          "Enter new category name:",
          oldName
        );


      if (
        newNameInput === null
      ) {

        return;

      }


      const newName =
        newNameInput.trim();


      if (!newName) {

        alert(
          "Category name is required."
        );

        return;

      }


      if (
        newName === oldName
      ) {

        return;

      }


      const exists =
        categories.some(
          function(category) {

            return (
              category !== oldName &&
              category.toLowerCase() ===
              newName.toLowerCase()
            );

          }
        );


      if (exists) {

        alert(
          "This category already exists."
        );

        return;

      }


      const confirmed =
        confirm(
          "Rename category from \"" +
          oldName +
          "\" to \"" +
          newName +
          "\"?\n\nAll products using this category will also be updated."
        );


      if (!confirmed) {

        return;

      }


      showStatus(
        "Updating category..."
      );


      /* UPDATE CATEGORY */

      const {
        error:
          categoryError
      } =
        await supabaseClient

          .from(
            "categories"
          )

          .update({

            name:
              newName,

            updated_at:
              new Date()
                .toISOString()

          })

          .eq(
            "name",
            oldName
          );


      if (categoryError) {

        alert(
          categoryError.message
        );

        return;

      }


      /* UPDATE PRODUCTS */

      const {
        error:
          productError
      } =
        await supabaseClient

          .from(
            "products"
          )

          .update({

            category:
              newName,

            updated_at:
              new Date()
                .toISOString()

          })

          .eq(
            "category",
            oldName
          );


      if (productError) {


        /* TRY TO ROLLBACK CATEGORY */

        await supabaseClient

          .from(
            "categories"
          )

          .update({

            name:
              oldName,

            updated_at:
              new Date()
                .toISOString()

          })

          .eq(
            "name",
            newName
          );


        alert(
          "Category was changed but products could not be updated. The category change was rolled back.\n\n" +
          productError.message
        );


        await loadCategories();


        return;

      }


      await loadCategories();


      await loadProducts();


      showStatus(
        "Category renamed successfully."
      );

    }


    /* =====================================
       DELETE CATEGORY
    ===================================== */

    async function deleteCategory(
      categoryName
    ) {


      const {
        count,
        error:
          countError
      } =
        await supabaseClient

          .from(
            "products"
          )

          .select(
            "id",
            {
              count:
                "exact",
              head:
                true
            }
          )

          .eq(
            "category",
            categoryName
          );


      if (countError) {

        alert(
          countError.message
        );

        return;

      }


      if (
        Number(
          count || 0
        ) > 0
      ) {

        alert(
          "This category has " +
          count +
          " product(s).\n\nPlease move those products to another category before deleting this category."
        );

        return;

      }


      const confirmed =
        confirm(
          "Delete category \"" +
          categoryName +
          "\" permanently?"
        );


      if (!confirmed) {

        return;

      }


      showStatus(
        "Deleting category..."
      );


      const {
        error
      } =
        await supabaseClient

          .from(
            "categories"
          )

          .delete()

          .eq(
            "name",
            categoryName
          );


      if (error) {

        alert(
          error.message
        );

        return;

      }


      await loadCategories();


      showStatus(
        "Category deleted successfully."
      );

    }

    /* =====================================
       LOGIN
    ===================================== */

    async function login() {


      const email =
        document.getElementById(
          "loginEmail"
        ).value.trim();


      const password =
        document.getElementById(
          "loginPassword"
        ).value;


      const button =
        document.getElementById(
          "loginButton"
        );


      const message =
        document.getElementById(
          "loginMessage"
        );


      if (
        !email ||
        !password
      ) {

        message.style.color =
          "#d33";


        message.textContent =
          "Please enter email and password.";


        return;

      }


      button.disabled =
        true;


      button.textContent =
        "LOGGING IN...";


      message.style.color =
        "#777";


      message.textContent =
        "Please wait...";


      try {


        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .signInWithPassword({

              email:
                email,

              password:
                password

            });


        if (error) {

          message.style.color =
            "#d33";


          message.textContent =
            error.message;


          button.disabled =
            false;


          button.textContent =
            "LOGIN";


          return;

        }


        const {
          data: admin,
          error:
            adminError
        } =
          await supabaseClient

            .from(
              "admin_users"
            )

            .select(
              "user_id, role"
            )

            .eq(
              "user_id",
              data.user.id
            )

            .maybeSingle();


        if (adminError) {

          await supabaseClient
            .auth
            .signOut();


          message.style.color =
            "#d33";


          message.textContent =
            adminError.message;


          button.disabled =
            false;


          button.textContent =
            "LOGIN";


          return;

        }


        if (
          !admin ||
          admin.role !== "admin"
        ) {

          await supabaseClient
            .auth
            .signOut();


          message.style.color =
            "#d33";


          message.textContent =
            "This account is not an admin.";


          button.disabled =
            false;


          button.textContent =
            "LOGIN";


          return;

        }


        await showAdmin();


      } catch (error) {


        message.style.color =
          "#d33";


        message.textContent =
          error.message ||
          "Login failed.";


        button.disabled =
          false;


        button.textContent =
          "LOGIN";

      }

    }

    /* =====================================
       LOAD PRODUCTS
    ===================================== */

    async function loadProducts() {


      showStatus(
        "Loading products..."
      );


      const {
        data,
        error
      } =
        await supabaseClient

          .from(
            "products"
          )

          .select("*")

          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        showStatus(
          error.message
        );


        document.getElementById(
          "productCount"
        ).textContent =
          "Could not load products.";


        return;

      }


      products =
        data || [];


      renderProducts();


      showStatus(
        products.length +
        " products loaded."
      );

    }


    /* =====================================
       RENDER PRODUCTS
    ===================================== */

    function renderProducts() {


      const list =
        document.getElementById(
          "productsList"
        );


      const search =
        document.getElementById(
          "searchProducts"
        )
        .value
        .trim()
        .toLowerCase();


      const category =
        document.getElementById(
          "categoryFilter"
        ).value;


      const filtered =
        products.filter(
          function(product) {


            const name =
              String(
                product.name ||
                ""
              )
              .toLowerCase();


            const id =
              String(
                product.id ||
                ""
              )
              .toLowerCase();


            const searchMatch =

              !search

              ||

              name.includes(
                search
              )

              ||

              id.includes(
                search
              );


            const categoryMatch =

              category ===
                "ALL"

              ||

              product.category ===
                category;


            return (
              searchMatch &&
              categoryMatch
            );

          }
        );


      document.getElementById(
        "productCount"
      ).textContent =

        filtered.length +
        " of " +
        products.length +
        " products";


      if (
        filtered.length === 0
      ) {

        list.innerHTML = `

          <div class="empty-products">

            No products found.

          </div>

        `;


        return;

      }


      list.innerHTML =
        filtered
          .map(
            function(product) {

              return productCard(
                product
              );

            }
          )
          .join("");

    }


    /* =====================================
       PRODUCT CARD
    ===================================== */

    function productCard(
      product
    ) {


      const id =
        escapeHtml(
          product.id
        );


      const jsId =
        escapeJs(
          product.id
        );


      const image =
        product.image_url ||
        "";


      const price =
        Number(
          product.price ||
          0
        );


      const salePrice =
        product.sale_price !== null &&
        product.sale_price !== undefined

          ?

          Number(
            product.sale_price
          )

          :

          "";


      const sale =
        product.sale === true;


      const active =
        product.active !== false;


      const productCategory =
        String(
          product.category ||
          ""
        );


      const categoryOptions =
        [
          ...categories
        ];


      if (
        productCategory &&
        !categoryOptions.includes(
          productCategory
        )
      ) {

        categoryOptions.unshift(
          productCategory
        );

      }


      return `

        <div
          class="product-card
            ${
              active
                ? ""
                : "hidden-product"
            }">


          ${
            !active

            ?

            `
              <div class="hidden-badge">
                HIDDEN
              </div>
            `

            :

            ""

          }


          ${
            sale

            ?

            `
              <div class="sale-badge">
                SALE
              </div>
            `

            :

            ""

          }


          <div class="product-image">


            ${
              image

              ?

              `
                <img
                  src="${escapeHtml(image)}"
                  alt="${escapeHtml(product.name)}">
              `

              :

              `
                <span class="no-image">
                  No image
                </span>
              `

            }


          </div>


          <div class="product-body">


            <h3>

              ${escapeHtml(
                product.name
              )}

            </h3>


            <div
              class="category-display">

              ${escapeHtml(
                product.category
              )}

            </div>


            <div
              class="edit-field">

              <label>
                Product Name
              </label>

              <input
                type="text"
                id="name-${id}"
                value="${escapeHtml(
                  product.name
                )}">

            </div>


            <div class="two-column">


              <div class="edit-field">

                <label>
                  Price
                </label>

                <input
                  type="number"
                  min="0"
                  id="price-${id}"
                  value="${price}">

              </div>


              <div class="edit-field">

                <label>
                  Sale Price
                </label>

                <input
                  type="number"
                  min="0"
                  id="saleprice-${id}"
                  value="${salePrice}">

              </div>


            </div>


            <div class="edit-field">

              <label>
                Category
              </label>

              <select
                id="category-${id}">


                ${
                  categoryOptions
                    .map(
                      function(category) {

                        return `

                          <option
                            value="${escapeHtml(
                              category
                            )}"

                            ${
                              product.category ===
                              category
                                ? "selected"
                                : ""
                            }>

                            ${escapeHtml(
                              category
                            )}

                          </option>

                        `;

                      }
                    )
                    .join("")
                }


              </select>

            </div>


            <div class="sale-row">


              <input
                type="checkbox"
                id="sale-${id}"
                ${
                  sale
                    ? "checked"
                    : ""
                }>


              <label
                for="sale-${id}">

                Sale Active

              </label>


            </div>


            <label
              class="upload-label">

              CHANGE IMAGE

              <input
                class="upload-input"
                type="file"
                accept="image/*"
                onchange="uploadImage(
                  '${jsId}',
                  this.files[0]
                )">

            </label>


            <div class="action-row">


              <button
                type="button"
                class="save-btn"
                onclick="saveProduct(
                  '${jsId}'
                )">

                SAVE

              </button>


              <button
                type="button"
                class="hide-btn"
                onclick="toggleActive(
                  '${jsId}'
                )">

                ${
                  active
                    ? "HIDE"
                    : "SHOW"
                }

              </button>


              <button
                type="button"
                class="delete-btn"
                onclick="deleteProduct(
                  '${jsId}'
                )">

                DELETE PRODUCT

              </button>


            </div>


          </div>


        </div>

      `;

    }


    /* =====================================
       SAVE PRODUCT
    ===================================== */

    async function saveProduct(
      id
    ) {


      const name =
        document.getElementById(
          "name-" + id
        ).value
          .trim();


      const price =
        Number(
          document.getElementById(
            "price-" + id
          ).value
        );


      const salePriceText =
        document.getElementById(
          "saleprice-" + id
        ).value;


      const salePrice =
        salePriceText
          ? Number(
              salePriceText
            )
          : null;


      const category =
        document.getElementById(
          "category-" + id
        ).value;


      const sale =
        document.getElementById(
          "sale-" + id
        ).checked;


      if (!name) {

        alert(
          "Product name is required."
        );

        return;

      }


      showStatus(
        "Saving product..."
      );


      const {
        error
      } =
        await supabaseClient

          .from(
            "products"
          )

          .update({

            name:
              name,

            price:
              price,

            category:
              category,

            sale:
              sale,

            sale_price:
              sale
                ? salePrice
                : null,

            updated_at:
              new Date()
                .toISOString()

          })

          .eq(
            "id",
            id
          );


      if (error) {

        alert(
          error.message
        );

        return;

      }


      showStatus(
        "Product saved successfully."
      );


      await loadProducts();

    }


    /* =====================================
       HIDE / SHOW
    ===================================== */

    async function toggleActive(
      id
    ) {


      const product =
        products.find(
          function(item) {

            return item.id === id;

          }
        );


      if (!product) {
        return;
      }


      const newActive =
        product.active === false;


      const {
        error
      } =
        await supabaseClient

          .from(
            "products"
          )

          .update({

            active:
              newActive,

            updated_at:
              new Date()
                .toISOString()

          })

          .eq(
            "id",
            id
          );


      if (error) {

        alert(
          error.message
        );

        return;

      }


      showStatus(
        newActive
          ? "Product is now visible."
          : "Product is now hidden."
      );


      await loadProducts();

    }


    /* =====================================

      const product =

      const confirmed =

          .eq(

            id
          );


      if (error) {

        alert(
          error.message

        return;

      );


      await loadProducts();

    }


    /* =====================================
       UPLOAD IMAGE
    ===================================== */

    async function uploadImage(
      productId,
      file
    ) {


      if (!file) {
        return;
      }


      showStatus(
        "Uploading image..."
      );


      const safeName =
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "-"
        );


      const filePath =
        "products/" +
        crypto.randomUUID() +
        "-" +
        safeName;


      const {
        error:
          uploadError
      } =
        await supabaseClient

          .storage

          .from(
            "product-images"
          )

          .upload(
            filePath,
            file,
            {
              cacheControl:
                "3600",

              upsert:
                false
            }
          );


      if (uploadError) {

        alert(
          uploadError.message
        );

        return;

      }


      const {
        data:
          publicData
      } =
        supabaseClient

          .storage

          .from(
            "product-images"
          )

          .getPublicUrl(
            filePath
          );


      const imageUrl =
        publicData.publicUrl;


      const {
        error:
          updateError
      } =
        await supabaseClient

          .from(
            "products"
          )

          .update({

            image_url:
              imageUrl,

            updated_at:
              new Date()
                .toISOString()

          })

          .eq(
            "id",
            productId
          );


      if (updateError) {

        alert(
          updateError.message
        );

        return;

      }


      showStatus(
        "Image updated successfully."
      );


      await loadProducts();

    }

        document.getElementById(

        ).files[0];

          )
          .replace(

          imageFile.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "-"
          );


        const filePath =
          "products/" +
          crypto.randomUUID() +
          "-" +
          safeName;


        const {
          error:
            uploadError
        } =
          await supabaseClient

            .storage

            .from(
              "product-images"
            )

            .upload(
              filePath,
              imageFile,
              {
                cacheControl:
                  "3600",

                upsert:
                  false
              }
            );


        if (uploadError) {

          alert(
            uploadError.message
          );

          return;

        }


        const {
          data:
            publicData
        } =
          supabaseClient

            .storage

            .from(
              "product-images"
            )

            .getPublicUrl(
              filePath
            );


        imageUrl =
          publicData.publicUrl;

      }


      /* INSERT PRODUCT */

      const {
        error
      } =
        await supabaseClient

          .from(
            "products"
          )

          .insert({

            id:
              id,

            name:
              name,

            category:
              category,

            price:
              price || 0,

            sale:
              sale,

            sale_price:
              sale
                ? salePrice
                : null,

            image_url:
              imageUrl,

            active:
              true

          });


      if (error) {

        alert(
          error.message
        );

        return;

      }


      closeCreateModal();


      showStatus(
        "Product added successfully."
      );


      await loadProducts();

    }


    /* =====================================
       MODAL
    ===================================== */

    function openCreateModal() {

      document
        .getElementById(
          "createModal"
        )
        .classList
        .add("active");

    }


    function closeCreateModal() {

      document
        .getElementById(
          "createModal"
        )
        .classList
        .remove("active");


      document.getElementById(
        "newName"
      ).value = "";


      document.getElementById(
        "newPrice"
      ).value = "0";


      document.getElementById(
        "newSalePrice"
      ).value = "";


      document.getElementById(
        "newSale"
      ).checked = false;


      document.getElementById(
        "newImage"
      ).value = "";

    }


    function closeModalOutside(
      event
    ) {

      if (
        event.target.id ===
        "createModal"
      ) {

        closeCreateModal();

      }

    }


    /* =====================================
       STATUS
    ===================================== */

    function showStatus(
      message
    ) {

      const box =
        document.getElementById(
          "statusBox"
        );


      box.textContent =
        message;


      box.classList.add(
        "show"
      );


      clearTimeout(
        window.statusTimer
      );


      window.statusTimer =
        setTimeout(
          function() {

            box.classList.remove(
              "show"
            );

          },
          2500
        );

    }


    /* =====================================
       ESCAPE
    ===================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

    }


    function escapeJs(
      value
    ) {

      return String(
        value ?? ""
      )
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      )
      .replace(
        /\r/g,
        "\\r"
      )
      .replace(
        /\n/g,
        "\\n"
      )
      .replace(
        /\u2028/g,
        "\\u2028"
      )
      .replace(
        /\u2029/g,
        "\\u2029"
      );

    }


    /* =====================================
       START
    ===================================== */

    checkSession();

  </script>


</body>
