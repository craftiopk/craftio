<!DOCTYPE html>
<html lang="en">
<head>

  <title>Product | Craftio Gifts</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f7f7f7;
      color:#111;
    }

    nav{
      background:#111;
      color:white;
      padding:18px 7%;
      display:flex;

      align-items:center;

    .logo-text{

    .product-box{

    }

      margin-bottom:25px;

    .customization-box{
      background:#f8fcfe;
      border:1px solid #d8eef7;
      border-radius:12px;
      padding:18px;
      margin-bottom:25px;

    .customization-box h2{

      margin-bottom:16px;
    }

      margin-bottom:15px;
    }

      margin-bottom:7px;

      width:100%;

      font-size:15px;

    .custom-field input:focus,
    .custom-field textarea:focus{

    .custom-field textarea{

      resize:vertical;
    }

      padding:10px 12px;
      margin-top:5px;
      color:#555;
      font-size:14px;

    .quantity-box{

      align-items:center;

    .quantity-box button{

      cursor:pointer;
      font-size:22px;

/* =========================
   RENDER CUSTOMIZATION
========================= */

function renderCustomization(){

  const box =
    document.getElementById(
      "customizationBox"
    );

  const config =
    getCustomizationConfig();


  if(!config){

    box.style.display =
      "none";

    box.innerHTML = "";

    return;
  }


  box.style.display =
    "block";


  let html =
    `<h2>${config.title}</h2>`;


  config.fields.forEach(
    field => {

      html += `
        <div class="custom-field">

          <label
            for="custom_${field.key}"
          >
            ${field.label}
          </label>
      `;


      if(
        field.type === "textarea"
      ){

        html += `
          <textarea
            id="custom_${field.key}"
            placeholder="${field.placeholder || ""}"
            ${field.required ? "required" : ""}
          ></textarea>
        `;

      }else{

        html += `
          <input
            type="${field.type}"
            id="custom_${field.key}"
            placeholder="${field.placeholder || ""}"
            ${field.required ? "required" : ""}
          >
        `;

      }


      html += `
        </div>
      `;

    }
  );


  if(config.note){

    html += `
      <div class="custom-note">
        ${config.note}
      </div>
    `;

  }


  box.innerHTML =
    html;
}


/* =========================
   GET PRICE
========================= */

function getProductPrice(){

  if(
    product.sale === true &&
    Number(product.sale_price) > 0
  ){

    return Number(
      product.sale_price
    );

  }

  return Number(
    product.price
  ) || 0;
}


/* =========================
   LOAD PRODUCT
========================= */

async function loadProduct(){

  if(!productId){

    document.getElementById(
      "productName"
    ).textContent =
      "Product not found";

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq("id",productId)
      .maybeSingle();


  if(error){

    console.error(error);

    document.getElementById(
      "productName"
    ).textContent =
      "Unable to load product.";

    return;
  }


  if(!data){

    document.getElementById(
      "productName"
    ).textContent =
      "Product not found.";

    return;
  }


  product = data;


  const image =
    document.getElementById(
      "productImage"
    );

  image.src =
    product.image_url || "";

  image.alt =
    product.name || "";


  document.getElementById(
    "productName"
  ).textContent =
    product.name || "Product";


  const price =
    getProductPrice();


  document.getElementById(
    "productPrice"
  ).textContent =
    price > 0
      ? "Rs. " +
        price.toLocaleString("en-PK")
      : "Price will be updated";


  document.getElementById(
    "productDescription"
  ).textContent =
    product.description || "";


  renderCustomization();

}


/* =========================
   COLLECT CUSTOMIZATION
========================= */

function collectCustomization(){

  const config =
    getCustomizationConfig();


  if(
    !config ||
    !config.fields.length
  ){

    return {};
  }


  const details = {};


  for(
    const field of config.fields
  ){

    const element =
      document.getElementById(
        "custom_" +
        field.key
      );


    const value =
      element
        ? element.value.trim()
        : "";


    if(
      field.required &&
      !value
    ){

      alert(
        "Please enter " +
        field.label + "."
      );

      element.focus();

      return null;
    }


    if(value){

      details[field.key] =
        value;

    }

  }


  return details;
}


/* =========================
   IMAGE ZOOM
========================= */

function openImageZoom(){

  const mainImage =
    document.getElementById(
      "productImage"
    );


  if(!mainImage.src) return;


  const modal =
    document.getElementById(
      "imageModal"
    );


  const zoomedImage =
    document.getElementById(
      "zoomedImage"
    );


  zoomedImage.src =
    mainImage.src;

  zoomedImage.alt =
    mainImage.alt;


  zoomedImage.classList.remove(
    "zoomed"
  );


  modal.classList.add(
    "active"
  );


  document.body.style.overflow =
    "hidden";
}


function toggleImageZoom(event){

  event.stopPropagation();

  document
    .getElementById(
      "zoomedImage"
    )
    .classList.toggle(
      "zoomed"
    );
}


function closeImageZoom(event){

  const modal =
    document.getElementById(
      "imageModal"
    );


  if(
    event &&
    event.target !== modal &&
    !event.target.classList.contains(
      "image-modal-close"
    )
  ){

    return;
  }


  modal.classList.remove(
    "active"
  );


  document
    .getElementById(
      "zoomedImage"
    )
    .classList.remove(
      "zoomed"
    );


  document.body.style.overflow =
    "";
}


document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      const modal =
        document.getElementById(
          "imageModal"
        );


      if(
        modal.classList.contains(
          "active"
        )
      ){

        modal.classList.remove(
          "active"
        );


        document
          .getElementById(
            "zoomedImage"
          )
          .classList.remove(
            "zoomed"
          );


        document.body.style.overflow =
          "";
      }

    }

  }
);


/* =========================
   QUANTITY
========================= */

function increaseQuantity(){

  const input =
    document.getElementById(
      "quantity"
    );


  input.value =
    (parseInt(input.value) || 1)
    + 1;
}


function decreaseQuantity(){

  const input =
    document.getElementById(
      "quantity"
    );


  const value =
    parseInt(input.value) || 1;


  if(value > 1){

    input.value =
      value - 1;
  }
}


/* =========================
   CART
========================= */

function getCart(){

  return JSON.parse(
    localStorage.getItem(
      "craftioCart"
    )
  ) || [];
}


function saveCart(cart){

  localStorage.setItem(
    "craftioCart",
    JSON.stringify(cart)
  );
}


function updateCartCount(){

  const cart =
    getCart();


  const count =
    cart.reduce(
      (total,item) =>
        total +
        (Number(item.quantity) || 0),
      0
    );


  document.getElementById(
    "cartCount"
  ).textContent =
    count;
}


function sameCustomization(
  a,
  b
){

  return JSON.stringify(
    a || {}
  ) ===
  JSON.stringify(
    b || {}
  );
}


/* =========================
   ADD TO CART
========================= */

function addProductToCart(){

  if(!product) return;


  const customization =
    collectCustomization();


  if(
    customization === null
  ){

    return;
  }


  const quantity =
    parseInt(
      document.getElementById(
        "quantity"
      ).value
    ) || 1;


  const cart =
    getCart();


  const existing =
    cart.find(
      item =>
        item.id === product.id &&
        sameCustomization(
          item.customization,
          customization
        )
    );


  if(existing){

    existing.quantity +=
      quantity;

  }else{

    cart.push({
      id:product.id,
      quantity:quantity,
      customization:customization
    });

  }


  saveCart(cart);

  updateCartCount();


  alert(
    product.name +
    " added to your cart!"
  );


  window.location.href =
    "products.html";
}


/* =========================
   BUY NOW
========================= */

function buyNow(){

  if(!product) return;


  const customization =
    collectCustomization();


  if(
    customization === null
  ){

    return;
  }


  const quantity =
    parseInt(
      document.getElementById(
        "quantity"
      ).value
    ) || 1;


  const buyNowCart = [
    {
      id:product.id,
      quantity:quantity,
      customization:customization
    }
  ];


  localStorage.setItem(
    "craftioBuyNow",
    JSON.stringify(
      buyNowCart
    )
  );


  window.location.href =
    "checkout.html?buyNow=true";
}


/* =========================

updateCartCount();

loadProduct();

</script>
