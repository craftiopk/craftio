    ========================= */

    nav {

      color: #fff;

      padding: 17px 6%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      position: sticky;

      top: 0;

      z-index: 2000;

    }


    .logo-link {

      color: #fff;

      text-decoration: none;

      display: inline-block;

    }


    .logo-text {

    .logo-text span {

      color: #00aef0;

    }


    .nav-links {

      align-items: center;

      gap: 24px;

    }


    .nav-links a {

      font-size: 15px;

      font-weight: 700;

    }


    .nav-links a:hover {

      color: #00aef0;

    }

      border-radius: 8px;

    }


    .cart-link:hover {

    /* =========================
       PRODUCT PAGE
    ========================= */

    .product-page {

      max-width: 1200px;

      margin: 55px auto;

      padding: 0 25px;

    }


    .product-box {

      background: #fff;

      border-radius: 18px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 45px;

      padding: 35px;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.06);

    }


    /* =========================
       IMAGE
    ========================= */

    .product-image-wrap {

      width: 100%;

      min-height: 520px;

      border-radius: 14px;

      background: #f7f7f7;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

    }


    .product-image {

      width: 100%;

      height: 520px;

      object-fit: contain;

      padding: 10px;

      display: block;

      cursor: zoom-in;

    }


    /* =========================
       DETAILS
    ========================= */

    .product-details {

      padding: 10px;

      display: flex;

      flex-direction: column;

      justify-content: center;

    }


    .category-label {

      display: inline-block;

      width: fit-content;

      padding: 7px 11px;

      margin-bottom: 14px;

      border-radius: 999px;

      background: #e9f8ff;

      color: #008fc5;

      font-size: 11px;

      font-weight: 800;

      line-height: 1.3;

      font-size: 29px;

      font-weight: 800;

    .price-note {

      color: #777;

      font-size: 16px;

      font-weight: 700;

      color: #555;

      font-size: 16px;

      line-height: 1.75;

      margin-bottom: 25px;

    .customization-box h3 {

      font-size: 18px;

    .custom-field {

      margin-bottom: 14px;

    .custom-field label {

    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================
       ESCAPE JS
    ========================= */

    function escapeJs(
      value
    ) {

      return String(
        value ?? ""
      )

        .replace(
          /\\/g,
          "\\\\"
        )

        .replace(
          /'/g,
          "\\'"
        );

    }


    /* =========================
       ACTUAL PRICE
    ========================= */

    function getActualPrice(
      product
    ) {

      const regularPrice =
        Number(
          product.price || 0
        );


      const salePrice =
        Number(
          product.sale_price || 0
        );


      if (
        product.sale === true &&
        salePrice > 0
      ) {

        return salePrice;

      }


      return regularPrice;

    }


    /* =========================
       PRICE HTML
    ========================= */

    function getPriceHtml(
      product
    ) {

      const regularPrice =
        Number(
          product.price || 0
        );


      const salePrice =
        Number(
          product.sale_price || 0
        );


      if (
        product.sale === true &&
        salePrice > 0 &&
        regularPrice > 0 &&
        salePrice < regularPrice
      ) {

        return `

          <span
            class="old-price">

            Rs.
            ${regularPrice.toLocaleString()}

          </span>


          <span
            class="sale-price">

            Rs.
            ${salePrice.toLocaleString()}

          </span>

        `;

      }


      if (
        regularPrice > 0
      ) {

        return `

          Rs.
          ${regularPrice.toLocaleString()}

        `;

      }


      return `

        <span
          class="price-note">

          Price will be updated

        </span>

      `;

    }

            },


            {
              id:
                "brideName",

              label:
                "Bride Name",

              placeholder:
                "Enter bride name"

            },


            {
              id:
                "nikkahDate",

              label:
                "Nikkah Date (DD/MM/YYYY)",

              placeholder:
                "DD/MM/YYYY"

            }

          ],

          note:
            "Your names and date will be included in the WhatsApp order details."

        };

      }


      if (
        c === "TRENDY CHARTS"
      ) {

        return {

          fields: [

            {
              id:
                "name",

              label:
                "Name",

              placeholder:
                "Enter name"

            }

          ],

          note:
            "Please send your pictures on WhatsApp after placing your order."

        };

      }


      if (
        c === "NAME KEYCHAINS"
      ) {

        return {

          fields: [

            {
              id:
                "name",

              label:
                "Name",

              placeholder:
                "Enter name"

            }

          ],

          note:
            "The name will be included in your WhatsApp order."

        };

      }


      if (
        c === "PVC CARD"
      ) {

        return {

          fields: [

            {
              id:
                "details",

              label:
                "Other Details",

              placeholder:
                "Enter other details"

            }

          ],

          note:
            "Please send your picture and details on WhatsApp after placing your order."

        };

      }


      if (
        c === "MAGIC LAMPS"
      ) {

        return {

          fields: [],

          note:
            "Please send your picture on WhatsApp after placing your order."

        };

      }


      /*
        Also handle individual products
        where category is not set exactly.
      */

      if (
        nameIncludes(
          product.name,
          [
            "LED",
            "PHOTO FRAME"
          ]
        )
      ) {

        return {

          fields: [

            {
              id:
                "name",

              label:
                "Name",

              placeholder:
                "Enter name"

            },

            {
              id:
                "date",

              label:
                "Date (DD/MM/YYYY)",

              placeholder:
                "DD/MM/YYYY"

            }

          ],

          note:
            "Please send your picture on WhatsApp after placing your order."

        };

      }


      return {

        fields: [],

        note: ""

      };

    }


    function nameIncludes(
      value,
      words
    ) {

      const text =
        String(
          value || ""
        )
        .toUpperCase();


      return words.some(
        function(word) {

          return text.includes(
            word
          );

        }
      );

    }


    /* =========================
       CUSTOMIZATION HTML
    ========================= */

    function renderCustomization() {

      const config =
        getCustomizationConfig(
          product.category
        );


      if (
        config.fields.length === 0 &&
        !config.note
      ) {

        return "";

      }


      let html = `

        <div
          class="customization-box">

          <h3>
            Personalization
          </h3>

      `;


      config.fields.forEach(
        function(field) {

          html += `

            <div
              class="custom-field">

              <label
                for="${field.id}">

                ${escapeHtml(
                  field.label
                )}

              </label>

              <input
                type="text"
                id="${field.id}"
                placeholder="${escapeHtml(
                  field.placeholder
                )}">

            </div>

          `;

        }
      );


      if (
        config.note
      ) {

        html += `

          <div
            class="whatsapp-note">

            ${escapeHtml(
              config.note
            )}

          </div>

        `;

      }


      html += `

        </div>

      `;


      return html;

    }


    /* =========================
       CUSTOMIZATION VALUES
    ========================= */

    function getCustomization() {

      const config =
        getCustomizationConfig(
          product.category
        );


      const values = {};


      config.fields.forEach(
        function(field) {

          const input =
            document.getElementById(
              field.id
            );


          if (input) {

            values[field.id] =
              input.value.trim();

          }

        }
      );


      return values;

    }


    /* =========================
       LOAD PRODUCT FROM SUPABASE
    ========================= */

    async function loadProduct() {

      const main =
        document.getElementById(
          "mainContent"
        );


      if (!productId) {

        main.className =
          "error-page";


        main.innerHTML = `

          <h2>
            Product not found
          </h2>

          <p>
            No product was selected.
          </p>

          <a href="products.html">

            Back to Products

          </a>

        `;


        return;

      }


      main.innerHTML = `

        Loading product...

      `;


      try {

        const {
          data,
          error
        } =

          await supabaseClient

            .from("products")

            .select("*")

            .eq(
              "id",
              productId
            )

            .eq(
              "active",
              true
            )

            .single();


        if (
          error ||
          !data
        ) {

          console.error(
            error
          );


          main.className =
            "error-page";


          main.innerHTML = `

            <h2>
              Product not found
            </h2>

            <p>
              This product could not be loaded.
            </p>

            <a href="products.html">

              Back to Products

            </a>

          `;


          return;

        }


        product =
          data;


        const description =
          String(
            product.description || ""
          ).trim()
          ||
          getProductDescription(
            product
          );


        const category =
          String(
            product.category || ""
          ).trim();


        main.className =
          "product-page";


        main.innerHTML = `

          <div
            class="product-box">


            <div
              class="product-image-wrap">


              <img
                id="productImage"
                class="product-image"
                src="${escapeHtml(
                  product.image_url || ""
                )}"
                alt="${escapeHtml(
                  product.name || ""
                )}"
                onclick="openImageZoom()">


            </div>


            <div
              class="product-details">


              ${
                category

                  ?

                  `

                    <div
                      class="category-label">

                      ${escapeHtml(
                        category
                      )}

                    </div>

                  `

                  :

                  ""
              }


              <h1>

                ${escapeHtml(
                  product.name ||
                  "Product"
                )}

              </h1>


              <div
                class="price">

                ${getPriceHtml(
                  product
                )}

              </div>


              <p
                class="description">

                ${escapeHtml(
                  description
                )}

              </p>


              ${renderCustomization()}


              <div
                class="quantity-label">

                Quantity:

              </div>


              <div
                class="quantity-box">


                <button
                  type="button"
                  onclick="decreaseQuantity()">

                  −

                </button>


                <input
                  type="number"
                  id="quantity"
                  value="1"
                  min="1">


                <button
                  type="button"
                  onclick="increaseQuantity()">

                  +

                </button>


              </div>


              <button
                type="button"
                class="buy-btn"
                onclick="buyNow()">

                BUY NOW

              </button>


              <button
                type="button"
                class="add-cart-btn"
                onclick="addProductToCart()">

                🛒 ADD TO CART

              </button>


              <a
                href="products.html"
                class="back-link">

                ← Back to Products

              </a>


            </div>


          </div>

        `;


        updateCartCount();


      } catch (error) {

        console.error(
          error
        );


        main.className =
          "error-page";


        main.innerHTML = `

          <h2>
            Unable to load product
          </h2>

          <p>
            Please refresh the page and try again.
          </p>

          <a href="products.html">

            Back to Products

          </a>

        `;

      }

    }


    /* =========================
       QUANTITY
    ========================= */

    function increaseQuantity() {

      const input =
        document.getElementById(
          "quantity"
        );


      if (!input) {
        return;
      }


      input.value =
        Number(
          input.value || 1
        ) + 1;

    }


    function decreaseQuantity() {

      const input =
        document.getElementById(
          "quantity"
        );


      if (!input) {
        return;
      }


      let value =
        Number(
          input.value || 1
        );


      if (
        value > 1
      ) {

        value--;

      }


      input.value =
        value;

    }


    /* =========================
       CART
    ========================= */

    function getCart() {

      try {

        return (
          JSON.parse(
            localStorage.getItem(
              "craftioCart"
            )
          ) || []
        );

      } catch (error) {

        return [];

      }

    }


    function saveCart(
      cart
    ) {

      localStorage.setItem(
        "craftioCart",
        JSON.stringify(
          cart
        )
      );

    }


    function addProductToCart() {

      if (!product) {
        return;
      }


      const input =
        document.getElementById(
          "quantity"
        );


      const quantity =
        Math.max(
          1,
          Number(
            input?.value || 1
          )
        );


      const customization =
        getCustomization();


      const cart =
        getCart();


      const existing =
        cart.find(
          function(item) {

            return (
              item.id ===
              product.id
            );

          }
        );


      if (existing) {

        existing.quantity =
          Number(
            existing.quantity || 0
          ) + quantity;


        existing.customization =
          customization;

      } else {

        cart.push({

          id:
            product.id,

          quantity:
            quantity,

          customization:
            customization

        });

      }


      saveCart(
        cart
      );


      alert(
        "Product added to your cart!"
      );


      window.location.href =
        "products.html";

    }


    /* =========================
       BUY NOW
    ========================= */

    function buyNow() {

      if (!product) {
        return;
      }


      const input =
        document.getElementById(
          "quantity"
        );


      const quantity =
        Math.max(
          1,
          Number(
            input?.value || 1
          )
        );


      const customization =
        getCustomization();


      const buyNowCart = [

        {

          id:
            product.id,

          quantity:
            quantity,

          customization:
            customization

        }

      ];


      localStorage.setItem(
        "craftioBuyNow",
        JSON.stringify(
          buyNowCart
        )
      );


      window.location.href =
        "checkout.html?buyNow=true";

    }


    /* =========================
       CART COUNT
    ========================= */

    function updateCartCount() {

      const cart =
        getCart();


      const count =
        cart.reduce(
          function(total, item) {

            return (

              total +

              (
                Number(
                  item.quantity || 0
                )
              )

            );

          },
          0
        );


      const element =
        document.getElementById(
          "cartCount"
        );


      if (element) {

        element.textContent =
          count;

      }

    }


    /* =========================
       IMAGE ZOOM
    ========================= */

    function openImageZoom() {

      const mainImage =
        document.getElementById(
          "productImage"
        );


      const modal =
        document.getElementById(
          "imageModal"
        );


      const zoomedImage =
        document.getElementById(
          "zoomedImage"
        );


      if (
        !mainImage ||
        !mainImage.src
      ) {

        return;

      }


      zoomedImage.src =
        mainImage.src;


      zoomedImage.alt =
        mainImage.alt;


      zoomedImage.classList.remove(
        "zoomed"
      );


      modal.classList.add(
        "active"
      );


      document.body.style.overflow =
        "hidden";

    }


    function toggleImageZoom(
      event
    ) {

      event.stopPropagation();


      document
        .getElementById(
          "zoomedImage"
        )
        .classList
        .toggle(
          "zoomed"
        );

    }


    function closeImageZoom(
      event
    ) {

      const modal =
        document.getElementById(
          "imageModal"
        );


      if (
        event &&
        event.target !== modal &&
        !event.target.classList.contains(
          "image-modal-close"
        )
      ) {

        return;

      }


      modal.classList.remove(
        "active"
      );


      document
        .getElementById(
          "zoomedImage"
        )
        .classList
        .remove(
          "zoomed"
        );


      document.body.style.overflow =
        "";

    }


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Escape"
        ) {

          const modal =
            document.getElementById(
              "imageModal"
            );


          if (
            modal &&
            modal.classList.contains(
              "active"
            )
          ) {

            modal.classList.remove(
              "active"
            );


            document
              .getElementById(
                "zoomedImage"
              )
              .classList
              .remove(
                "zoomed"
              );


            document.body.style.overflow =
              "";

          }

        }

      }
    );


    /* =========================
       START
    ========================= */

    loadProduct();

  </script>

</body>

</html>
