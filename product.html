<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product | CRAFTIO GIFTS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f9fa;
            color: #222;
        }

        nav {
            background: #111;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        .product-container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .product-image-box {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .product-image-box img {
            width: 100%;
            max-height: 550px;
            object-fit: contain;
            border-radius: 10px;
        }

        .product-info h1 {
            font-size: 34px;
            line-height: 1.3;
            margin-bottom: 20px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .description {
            font-size: 16px;
            line-height: 1.7;
            color: #666;
            margin-bottom: 30px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .quantity-box label {
            font-weight: bold;
        }

        .quantity-box input {
            width: 70px;
            padding: 10px;
            font-size: 17px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
        }

        .buy-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-btn:hover {
            background: #333;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }

        .not-found {
            text-align: center;
            padding: 120px 20px;
        }

        .not-found h2 {
            margin-bottom: 20px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 60px;
        }

        @media (max-width: 768px) {

            .product-container {
                grid-template-columns: 1fr;
                gap: 30px;
                margin: 30px auto;
            }

            .product-info h1 {
                font-size: 27px;
            }

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }
        }
    </style>
</head>

<body>

<nav>

    <div class="logo">
        CRAFTIO GIFTS
    </div>

    <div>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="index.html#contact">Contact</a>
    </div>

</nav>


<div id="productArea"></div>


<footer>
    © 2026 CRAFTIO GIFTS. All Rights Reserved.
</footer>


<script>

const products = {

    "led-photo-frame": {
        name: "CUSTOMIZED LED PHOTO FRAME",

        image: "Light%20frame.jpeg"
    },

    "birthday-frame": {
        name: "CUSTOMIZED BIRTHDAY FRAME",
        price: 999,
        image: "Birthday%20Frame.jpeg"
    },

    "birthday-mug": {
        name: "CUSTOMIZED BIRTHDAY MUG",
        price: 999,
        image: "birthday%20mug.jpeg"
    },

    "led-heart-lamp": {
        name: "CUSTOMIZED LED HEART LAMP",
        price: 2500,
        image: "MOON%20PICTURE%20FRAME.jpeg"
    },

    "nikkah-signature-frame": {
        name: "CUSTOMIZED NIKKAH SIGNATURE FRAME",
        price: 999,
        image: "nikkah%20frame.jpeg"
    },

    "magic-mug": {
        name: "CUSTOMIZED MAGIC MUG",
        price: 1400,
        image: "magic%20mug.jpeg"
    },

    "wedding-ring-plaque": {
        name: "CUSTOMIZED WEDDING RING PLAQUE",
        price: 2500,
        image: "NIKKAH%20PLAQUE.jpeg"
    },

    "trendy-charts": {
        name: "CUSTOMIZED TRENDY CHARTS",
        price: 1350,
        image: "TRENDY%20CHARTS.jpeg"
    },

    "eye-pendant-necklace": {
        name: "CUSTOMIZED EYE PENDANT NECKLACE",
        price: 1300,
        image: "EYE%20NECKLACE.jpeg"
    },

    "picture-frame": {
        name: "CUSTOMIZED PICTURE FRAME",
        price: 900,
        image: "PICTURE%20FRAME.jpg"
    },

    "friendship-license-card": {
        name: "CUSTOMIZED FRIENDSHIP LICENSE CARD",
        price: 900,
        image: "FRIENSHIP%20LICENSE%20CAED.jpeg"
    },

    "name-key-chain": {
        name: "CUSTOMIZED NAME KEY CHAIN",
        price: 800,
        image: "NAME%20KEY.jpeg"
    },

    "picture-mug-colors": {
        name: "CUSTOMIZED PICTURE MUG WITH DIFFERENT COLORS",
        price: 1350,
        image: "CUSTOMIZED%20MUG%20WITH%20COLORS.jpg"
    },

    "pubg-mobile-card": {
        name: "CUSTOMIZED PUBG MOBILE CARD",
        price: 800,
        image: "PUBG%20CARD.jpeg"
    },

    "snapchat-tiktok-instagram-card": {
        name: "CUSTOMIZED SNAPCHAT TIKTOK & INSTAGRAM CARD",
        price: 800,
        image: "SNAPCHAT%20CARD.jpeg"
    },

    "pvc-card": {
        name: "CUSTOMIZED PVC CARD",
        price: 850,
        image: "PVC%20CARD.jpg"
    }

};


const params = new URLSearchParams(window.location.search);

const productId = params.get("product");

const product = products[productId];

const productArea = document.getElementById("productArea");


if (product) {

    document.title = product.name + " | CRAFTIO GIFTS";

    productArea.innerHTML = `

        <div class="product-container">

            <div class="product-image-box">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

            </div>


            <div class="product-info">

                <h1>
                    ${product.name}
                </h1>

                <div class="price">
                    Rs. ${product.price}
                </div>

                <div class="description">

                    Make your special moments memorable
                    with our customized gift.
                    Perfect for birthdays, weddings,
                    anniversaries and special occasions.

                </div>


                <div class="quantity-box">

                    <label>
                        Quantity:
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        value="1"
                        min="1"
                    >

                </div>


                <button
                    class="buy-btn"
                    onclick="buyNow()"
                >
                    BUY NOW
                </button>


                <a
                    class="back-btn"
                    href="products.html"
                >
                    ← Back to Products
                </a>

            </div>

        </div>

    `;

} else {

    productArea.innerHTML = `

        <div class="not-found">

            <h2>
                Product Not Found
            </h2>

            <p>
                Please select a product from our products page.
            </p>

            <br>

            <a href="products.html">
                ← Back to Products
            </a>

        </div>

    `;

}


function buyNow() {

    const quantity =
        document.getElementById("quantity").value;

    window.location.href =
        "checkout.html?product=" +
        encodeURIComponent(productId) +
        "&quantity=" +
        encodeURIComponent(quantity);

}

</script>

</body>
</html>
