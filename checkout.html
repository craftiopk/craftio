<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Checkout | Craftio Gifts</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    nav {
      background: #111;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-text {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo-text span {
      color: #00aef0;
    }

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: #00aef0;
    }

    .checkout-page {
      max-width: 1100px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .page-title h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .page-title h1 span {
      color: #00aef0;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .box {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.05);
    }

    .box h2 {
      margin-bottom: 25px;
      font-size: 23px;
    }

    /* =========================
       ORDER ITEMS
    ========================= */

    .order-item {
      display: flex;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .order-item img {
      width: 85px;
      height: 85px;
      object-fit: contain;
      border-radius: 8px;
      background: #f7f7f7;
      padding: 5px;
      cursor: zoom-in;
      flex-shrink: 0;
    }

    .order-item-info {
      flex: 1;
    }

    .order-item-info h3 {
      font-size: 15px;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .order-item-info p {
      color: #666;
      margin-bottom: 5px;
    }

    .order-item-price {
      color: #00aef0;
      font-weight: 800;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .quantity-controls button {
      width: 28px;
      height: 28px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .remove-btn {
      width: auto !important;
      padding: 0 8px;
      color: #d00;
    }

    .total-box {
      margin-top: 25px;
      border-top: 2px solid #111;
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      font-size: 21px;
      font-weight: 800;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #00aef0;
    }

    .form-group textarea {
      height: 110px;
      resize: vertical;
    }

    .payment-box {
      margin-top: 25px;
      padding: 18px;
      background: #f5fbfe;
      border: 1px solid #d8eef7;
      border-radius: 10px;
    }

    .payment-box h3 {
      margin-bottom: 10px;
    }

    .payment-option {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .place-order {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 16px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 25px;
    }

    .place-order:hover {
      background: #333;
    }

    .back-products {
      display: inline-block;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
      font-weight: 600;
    }

    .back-products:hover {
      color: #00aef0;
    }

    .empty-message {
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }

    /* =========================
       IMAGE ZOOM MODAL
    ========================= */

    .image-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 25px;
      z-index: 3000;
      overflow: auto;
    }

    .image-modal.active {
      display: flex;
    }

    .image-modal img {
      max-width: 92vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      cursor: zoom-in;
      transition: transform 0.25s ease;
      touch-action: pinch-zoom;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .image-modal img.zoomed {
      transform: scale(1.7);
      cursor: zoom-out;
    }

    .image-modal-close {
      position: fixed;
      top: 18px;
      right: 22px;
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: white;
      color: #111;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      z-index: 3001;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-modal-close:hover {
      background: #eee;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      font-size: 14px;
      margin-top: 60px;
    }

    footer strong {
      color: #00aef0;
    }

    @media (max-width: 800px) {

      nav {
        flex-direction: column;
        gap: 15px;
      }

      .checkout-grid {
        grid-template-columns: 1fr;
      }

      .image-modal {
        padding: 15px;
      }

      .image-modal img {
        max-width: 94vw;
        max-height: 85vh;
      }

      .image-modal img.zoomed {
        transform: scale(1.45);
      }

    }

  </style>

</head>

<body>


  <!-- =========================
       NAVBAR
  ========================= -->

  <nav>

    <div class="logo-text">
      CRAFTIO <span>GIFTS</span>
    </div>

    <div class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a href="products.html">
        Products
      </a>

    </div>

  </nav>


  <!-- =========================
       CHECKOUT
  ========================= -->

  <main class="checkout-page">

    <div class="page-title">

      <h1>
        Complete Your <span>Order</span>
      </h1>

      <p>
        Please enter your delivery details below.
      </p>

    </div>


    <div class="checkout-grid">


      <!-- =========================
           ORDER SUMMARY
      ========================= -->

      <div class="box">

        <h2>
          🛒 Your Order
        </h2>

        <div id="orderItems"></div>

        <div id="totalBox"></div>

        <a
          href="products.html"
          class="back-products">
          ← Continue Shopping
        </a>

      </div>


      <!-- =========================
           CUSTOMER DETAILS
      ========================= -->

      <div class="box">

        <h2>
          Delivery Details
        </h2>


        <form id="checkoutForm">


          <div class="form-group">

            <label>
              Full Name
            </label>

            <input
              type="text"
              id="fullName"
              placeholder="Enter your full name"
              required>

          </div>


          <div class="form-group">

            <label>
              Phone Number
            </label>

            <input
              type="tel"
              id="phone"
              placeholder="03XXXXXXXXX"
              required>

          </div>


          <div class="form-group">

            <label>
              Complete Delivery Address
            </label>

            <textarea
              id="address"
              placeholder="House no, street, area..."
              required></textarea>

          </div>


          <div class="form-group">

            <label>
              City
            </label>

            <input
              type="text"
              id="city"
              placeholder="Enter your city"
              required>

          </div>


          <div class="payment-box">

            <h3>
              Payment Method
            </h3>

            <label class="payment-option">

              <input
                type="radio"
                checked
                disabled>

              Cash on Delivery

            </label>

          </div>


          <button
            type="submit"
            class="place-order">

            PLACE ORDER ON WHATSAPP

          </button>


        </form>

      </div>

    </div>

  </main>


  <!-- =========================
       IMAGE ZOOM MODAL
  ========================= -->

  <div
    class="image-modal"
    id="imageModal"
    onclick="closeImageZoom(event)">

    <button
      class="image-modal-close"
      type="button"
      onclick="closeImageZoom(event)">
      ×
    </button>

    <img
      id="zoomedImage"
      src=""
      alt=""
      onclick="toggleImageZoom(event)">

  </div>


  <footer>

    © 2026 <strong>Craftio Gifts</strong>.
    All Rights Reserved.

  </footer>


  <script>

    /* =========================
       PRODUCT DATABASE
    ========================= */

    const products = [

      {
        id: "led-photo-frame",
        name: "CUSTOMIZED LED PHOTO FRAME",
        price: 2000,
        image: "Light%20frame.jpeg"
      },

      {
        id: "birthday-frame",
        name: "CUSTOMIZED BIRTHDAY FRAME",
        price: 999,
        image: "Birthday%20Frame.jpeg"
      },

      {
        id: "birthday-mug",
        name: "CUSTOMIZED BIRTHDAY MUG",
        price: 999,
        image: "birthday%20mug.jpeg"
      },

      {
        id: "led-heart-lamp",
        name: "CUSTOMIZED LED HEART LAMP",
        price: 2500,
        image: "MOON%20PICTURE%20FRAME.jpeg"
      },

      {
        id: "nikkah-signature-frame",
        name: "CUSTOMIZED NIKKAH SIGNATURE FRAME",
        price: 999,
        image: "nikkah%20frame.jpeg"
      },

      {
        id: "magic-mug",
        name: "CUSTOMIZED MAGIC MUG",
        price: 1400,
        image: "magic%20mug.jpeg"
      },

      {
        id: "wedding-ring-plaque",
        name: "CUSTOMIZED WEDDING RING PLAQUE",
        price: 2500,
        image: "NIKKAH%20PLAQUE.jpeg"
      },

      {
        id: "trendy-charts",
        name: "CUSTOMIZED TRENDY CHARTS",
        price: 1350,
        image: "TRENDY%20CHARTS.jpeg"
      },

      {
        id: "eye-pendant-necklace",
        name: "CUSTOMIZED EYE PENDANT NECKLACE",
        price: 1300,
        image: "EYE%20NECKLACE.jpeg"
      },

      {
        id: "picture-frame",
        name: "CUSTOMIZED PICTURE FRAME",
        price: 900,
        image: "PICTURE%20FRAME.jpg"
      },

      {
        id: "friendship-license-card",
        name: "CUSTOMIZED FRIENDSHIP LICENSE CARD",
        price: 900,
        image: "FRIENSHIP%20LICENSE%20CAED.jpeg"
      },

      {
        id: "name-key-chain",
        name: "CUSTOMIZED NAME KEY CHAIN",
        price: 800,
        image: "NAME%20KEY.jpeg"
      },

      {
        id: "picture-mug-colors",
        name: "CUSTOMIZED PICTURE MUG WITH DIFFERENT COLORS",
        price: 1350,
        image: "CUSTOMIZED%20MUG%20WITH%20COLORS.jpg"
      },

      {
        id: "pubg-mobile-card",
        name: "CUSTOMIZED PUBG MOBILE CARD",
        price: 800,
        image: "PUBG%20CARD.jpeg"
      },

      {
        id: "snapchat-tiktok-instagram-card",
        name: "CUSTOMIZED SNAPCHAT TIKTOK & INSTAGRAM CARD",
        price: 800,
        image: "SNAPCHAT%20CARD.jpeg"
      },

      {
        id: "pvc-card",
        name: "CUSTOMIZED PVC CARD",
        price: 850,
        image: "PVC%20CARD.jpg"
      }

    ];


    /* =========================
       WHATSAPP NUMBER
    ========================= */

    const WHATSAPP_NUMBER =
      "923360763055";


    /* =========================
       GET CART
    ========================= */

    const urlParams =
      new URLSearchParams(
        window.location.search
      );

    const isBuyNow =
      urlParams.get("buyNow") === "true";


    function getCart() {

      if (isBuyNow) {

        return JSON.parse(
          localStorage.getItem(
            "craftioBuyNow"
          )
        ) || [];

      }

      return JSON.parse(
        localStorage.getItem(
          "craftioCart"
        )
      ) || [];

    }


    let cart = getCart();


    /* =========================
       DISPLAY ORDER
    ========================= */

    function renderOrder() {

      const orderItems =
        document.getElementById(
          "orderItems"
        );

      const totalBox =
        document.getElementById(
          "totalBox"
        );


      if (cart.length === 0) {

        orderItems.innerHTML = `

          <div class="empty-message">

            <h3>
              Your cart is empty.
            </h3>

            <p>
              Please select a product first.
            </p>

          </div>

        `;

        totalBox.innerHTML = "";

        return;

      }


      let total = 0;

      orderItems.innerHTML = "";


      cart.forEach(item => {

        const product =
          products.find(
            p => p.id === item.id
          );


        if (!product) return;


        const itemTotal =
          product.price *
          item.quantity;


        total += itemTotal;


        orderItems.innerHTML += `

          <div class="order-item">

            <img
              src="${product.image}"
              alt="${product.name}"
              onclick="openImageZoom(this.src, this.alt)"
            >

            <div class="order-item-info">

              <h3>
                ${product.name}
              </h3>

              <p>
                Rs. ${product.price} ×
                ${item.quantity}
              </p>

              <div class="order-item-price">
                Rs. ${itemTotal}
              </div>


              <div class="quantity-controls">

                <button
                  onclick="changeQuantity('${product.id}', -1)">
                  −
                </button>

                <strong>
                  ${item.quantity}
                </strong>

                <button
                  onclick="changeQuantity('${product.id}', 1)">
                  +
                </button>

                <button
                  class="remove-btn"
                  onclick="removeItem('${product.id}')">
                  Remove
                </button>

              </div>

            </div>

          </div>

        `;

      });


      totalBox.innerHTML = `

        <div class="total-box">

          <span>
            Total
          </span>

          <span>
            Rs. ${total}
          </span>

        </div>

      `;

    }


    /* =========================
       IMAGE ZOOM
    ========================= */

    function openImageZoom(src, alt) {

      const modal =
        document.getElementById(
          "imageModal"
        );

      const zoomedImage =
        document.getElementById(
          "zoomedImage"
        );


      zoomedImage.src = src;
      zoomedImage.alt = alt || "";

      zoomedImage.classList.remove(
        "zoomed"
      );

      modal.classList.add("active");

      document.body.style.overflow =
        "hidden";

    }


    function toggleImageZoom(event) {

      event.stopPropagation();

      const image =
        document.getElementById(
          "zoomedImage"
        );

      image.classList.toggle(
        "zoomed"
      );

    }


    function closeImageZoom(event) {

      const modal =
        document.getElementById(
          "imageModal"
        );


      if (
        event &&
        event.target !== modal &&
        !event.target.classList.contains(
          "image-modal-close"
        )
      ) {
        return;
      }


      modal.classList.remove(
        "active"
      );

      document.getElementById(
        "zoomedImage"
      ).classList.remove(
        "zoomed"
      );

      document.body.style.overflow =
        "";

    }


    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          const modal =
            document.getElementById(
              "imageModal"
            );


          if (
            modal.classList.contains(
              "active"
            )
          ) {

            modal.classList.remove(
              "active"
            );

            document.getElementById(
              "zoomedImage"
            ).classList.remove(
              "zoomed"
            );

            document.body.style.overflow =
              "";

          }

        }

      }
    );


    /* =========================
       CHANGE QUANTITY
    ========================= */

    function changeQuantity(
      productId,
      amount
    ) {

      const item =
        cart.find(
          item => item.id === productId
        );


      if (!item) return;


      item.quantity += amount;


      if (item.quantity <= 0) {

        cart =
          cart.filter(
            item =>
              item.id !== productId
          );

      }


      saveCurrentCart();

      renderOrder();

    }


    /* =========================
       REMOVE ITEM
    ========================= */

    function removeItem(productId) {

      cart =
        cart.filter(
          item =>
            item.id !== productId
        );


      saveCurrentCart();

      renderOrder();

    }


    /* =========================
       SAVE CART
    ========================= */

    function saveCurrentCart() {

      if (isBuyNow) {

        localStorage.setItem(
          "craftioBuyNow",
          JSON.stringify(cart)
        );

      } else {

        localStorage.setItem(
          "craftioCart",
          JSON.stringify(cart)
        );

      }

    }


    /* =========================
       GET TOTAL
    ========================= */

    function getTotal() {

      let total = 0;


      cart.forEach(item => {

        const product =
          products.find(
            p => p.id === item.id
          );


        if (product) {

          total +=
            product.price *
            item.quantity;

        }

      });


      return total;

    }


    /* =========================
       PLACE ORDER
    ========================= */

    document.getElementById(
      "checkoutForm"
    ).addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        if (cart.length === 0) {

          alert(
            "Your cart is empty. Please select a product first."
          );

          return;

        }


        const fullName =
          document.getElementById(
            "fullName"
          ).value.trim();


        const phone =
          document.getElementById(
            "phone"
          ).value.trim();


        const address =
          document.getElementById(
            "address"
          ).value.trim();


        const city =
          document.getElementById(
            "city"
          ).value.trim();


        const total =
          getTotal();


        let message =
          "🛍️ *NEW ORDER - CRAFTIO GIFTS*%0A%0A";


        message +=
          "*Customer Details*%0A";


        message +=
          "Name: " +
          encodeURIComponent(fullName) +
          "%0A";


        message +=
          "Phone: " +
          encodeURIComponent(phone) +
          "%0A";


        message +=
          "Address: " +
          encodeURIComponent(address) +
          "%0A";


        message +=
          "City: " +
          encodeURIComponent(city) +
          "%0A%0A";


        message +=
          "*Order Details*%0A";


        cart.forEach(
          (item, index) => {

            const product =
              products.find(
                p => p.id === item.id
              );


            if (!product) return;


            const itemTotal =
              product.price *
              item.quantity;


            message +=
              (index + 1) +
              ". " +
              encodeURIComponent(
                product.name
              ) +
              "%0A";


            message +=
              "Qty: " +
              item.quantity +
              "%0A";


            message +=
              "Price: Rs. " +
              itemTotal +
              "%0A%0A";

          }
        );


        message +=
          "*TOTAL: Rs. " +
          total +
          "*%0A%0A";


        message +=
          "Payment: Cash on Delivery";


        const whatsappURL =
          "https://wa.me/" +
          WHATSAPP_NUMBER +
          "?text=" +
          message;


        /*
          After successful order,
          clear the cart.
        */

        if (isBuyNow) {

          localStorage.removeItem(
            "craftioBuyNow"
          );

        } else {

          localStorage.removeItem(
            "craftioCart"
          );

        }


        window.open(
          whatsappURL,
          "_blank"
        );

      }
    );


    renderOrder();

  </script>

</body>
</html>
