<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Checkout | Craftio Gifts</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.png">

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <style>

    * {
      box-sizing: border-box;

      margin: 0;

      padding: 0;
    }

    body {
      font-family: "Poppins", Arial, sans-serif;

      background: #f7f7f7;

      color: #111;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }


    /* =========================
       NAVBAR
    ========================= */

    nav {
      background: #111;

      color: #fff;

      padding: 17px 6%;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .logo-link {
      color: #fff;

      text-decoration: none;
    }

    .logo-text {
      font-size: 25px;

      font-weight: 800;

      letter-spacing: 1px;
    }

    .logo-text span {
      color: #00aef0;
    }

    .nav-links {
      display: flex;

      gap: 24px;
    }

    .nav-links a {
      color: #fff;

      text-decoration: none;

      font-size: 15px;

      font-weight: 700;
    }

    .nav-links a:hover {
      color: #00aef0;
    }


    /* =========================
       CHECKOUT
    ========================= */

    .checkout-page {
      max-width: 1100px;

      margin: 50px auto;

      padding: 0 20px;
    }

    .page-title {
      text-align: center;

      margin-bottom: 35px;
    }

    .page-title h1 {
      font-size: 38px;

      margin-bottom: 8px;
    }

    .page-title h1 span {
      color: #00aef0;
    }

    .page-title p {
      color: #666;

      font-size: 15px;
    }

    .checkout-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 30px;
    }

    .box {
      background: #fff;

      border-radius: 15px;

      padding: 30px;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.05);
    }

    .box h2 {
      margin-bottom: 25px;

      font-size: 23px;
    }


    /* =========================
       ORDER ITEM
    ========================= */

    .order-item {
      display: flex;

      gap: 15px;

      padding: 15px 0;

      border-bottom:
        1px solid #eee;
    }

    .order-item img {
      width: 90px;

      height: 90px;

      object-fit: contain;

      background: #f7f7f7;

      border-radius: 8px;

      padding: 5px;

      cursor: zoom-in;

      flex-shrink: 0;
    }

    .order-item-info {
      flex: 1;
    }

    .order-item-info h3 {
      font-size: 15px;

      line-height: 1.35;

      margin-bottom: 6px;
    }

    .order-item-info p {
      color: #666;

      font-size: 13px;

      margin-bottom: 5px;
    }

    .order-item-price {
      color: #00aef0;

      font-weight: 800;

      font-size: 14px;
    }

    .custom-details {
      margin-top: 9px;

      padding: 9px 10px;

      background: #f7fbfd;

      border:
        1px solid #e1eef3;

      border-radius: 7px;

      font-size: 12px;

      line-height: 1.55;
    }

    .custom-details strong {
      font-weight: 700;
    }


    /* =========================
       QUANTITY
    ========================= */

    .quantity-controls {
      display: flex;

      align-items: center;

      gap: 8px;

      margin-top: 9px;

      flex-wrap: wrap;
    }

    .quantity-controls button {
      width: 28px;

      height: 28px;

      border:
        1px solid #ccc;

      background: #fff;

      border-radius: 5px;

      cursor: pointer;

      font-weight: bold;
    }

    .remove-btn {
      width: auto !important;

      padding: 0 9px;

      color: #d00;
    }


    /* =========================
       TOTAL
    ========================= */

    .total-box {
      margin-top: 25px;

      border-top:
        2px solid #111;

      padding-top: 18px;

      display: flex;

      justify-content: space-between;

      font-size: 21px;

      font-weight: 800;
    }


    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;

      margin-bottom: 7px;

      font-weight: 700;

      font-size: 14px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;

      padding: 13px;

      border:
        1px solid #ccc;

      border-radius: 8px;

      font-size: 14px;

      outline: none;

      background: #fff;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #00aef0;
    }

    .form-group textarea {
      min-height: 110px;

      resize: vertical;
    }


    /* =========================
       PAYMENT
    ========================= */

    .payment-box {
      margin-top: 25px;

      padding: 18px;

      background: #f5fbfe;

      border:
        1px solid #d8eef7;

      border-radius: 10px;
    }

    .payment-box h3 {
      margin-bottom: 10px;

      font-size: 17px;
    }

    .payment-option {
      display: flex;

      gap: 8px;

      align-items: center;

      font-size: 14px;
    }


    /* =========================
       ORDER BUTTON
    ========================= */

    .place-order {
      width: 100%;

      border: none;

      background: #111;

      color: #fff;

      padding: 16px;

      border-radius: 9px;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      margin-top: 25px;
    }

    .place-order:hover {
      background: #333;
    }


    /* =========================
       LINKS
    ========================= */

    .back-products {
      display: inline-block;

      margin-top: 20px;

      color: #555;

      text-decoration: none;

      font-weight: 600;
    }

    .back-products:hover {
      color: #00aef0;
    }


    /* =========================
       EMPTY / LOADING
    ========================= */

    .empty-message {
      text-align: center;

      padding: 30px 10px;

      color: #777;
    }

    .loading-message {
      text-align: center;

      padding: 35px 10px;

      color: #777;
    }


    /* =========================
       IMAGE MODAL
    ========================= */

    .image-modal {
      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,0.88);

      display: none;

      align-items: center;

      justify-content: center;

      padding: 25px;

      z-index: 3000;

      overflow: auto;
    }

    .image-modal.active {
      display: flex;
    }

    .image-modal img {
      max-width: 92vw;

      max-height: 90vh;

      width: auto;

      height: auto;

      object-fit: contain;

      border-radius: 10px;

      cursor: zoom-in;

      transition:
        transform 0.25s ease;
    }

    .image-modal img.zoomed {
      transform:
        scale(1.7);

      cursor: zoom-out;
    }

    .image-modal-close {
      position: fixed;

      top: 18px;

      right: 22px;

      width: 45px;

      height: 45px;

      border: none;

      border-radius: 50%;

      background: #fff;

      color: #111;

      font-size: 32px;

      cursor: pointer;

      z-index: 3001;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #111;

      color: #fff;

      text-align: center;

      padding: 25px;

      font-size: 14px;

      margin-top: 60px;
    }

    footer strong {
      color: #00aef0;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      nav {
        flex-direction: column;

        gap: 14px;
      }

      .checkout-grid {
        grid-template-columns:
          1fr;
      }

      .box {
        padding: 22px;
      }

    }

    @media (max-width: 500px) {

      .checkout-page {
        margin: 30px auto;

        padding: 0 12px;
      }

      .page-title h1 {
        font-size: 30px;
      }

      .order-item img {
        width: 75px;

        height: 75px;
      }

    }

  </style>

</head>


<body>

  <nav>

    <a
      href="index.html"
      class="logo-link">

      <div class="logo-text">

        CRAFTIO
        <span>GIFTS</span>

      </div>

    </a>


    <div class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a href="products.html">
        Products
      </a>

    </div>

  </nav>


  <main class="checkout-page">

    <div class="page-title">

      <h1>
        Complete Your
        <span>Order</span>
      </h1>

      <p>
        Please enter your delivery details below.
      </p>

    </div>


    <div class="checkout-grid">


      <!-- =========================
           ORDER
      ========================= -->

      <div class="box">

        <h2>
          🛒 Your Order
        </h2>

        <div
          id="orderItems">

          <div class="loading-message">

            Loading order...

          </div>

        </div>

        <div
          id="totalBox">

        </div>


        <a
          href="products.html"
          class="back-products">

          ← Continue Shopping

        </a>

      </div>


      <!-- =========================
           CUSTOMER DETAILS
      ========================= -->

      <div class="box">

        <h2>
          Delivery Details
        </h2>


        <form id="checkoutForm">


          <div class="form-group">

            <label
              for="fullName">

              Full Name

            </label>

            <input
              type="text"
              id="fullName"
              placeholder="Enter your full name"
              required>

          </div>


          <div class="form-group">

            <label
              for="phone">

              Phone Number

            </label>

            <input
              type="tel"
              id="phone"
              placeholder="03XXXXXXXXX"
              required>

          </div>


          <div class="form-group">

            <label
              for="address">

              Complete Delivery Address

            </label>

            <textarea
              id="address"
              placeholder="House no, street, area..."
              required></textarea>

          </div>


          <div class="form-group">

            <label
              for="city">

              City

            </label>

            <input
              type="text"
              id="city"
              placeholder="Enter your city"
              required>

          </div>


          <div class="payment-box">

            <h3>
              Payment Method
            </h3>

            <label
              class="payment-option">

              <input
                type="radio"
                checked
                disabled>

              Cash on Delivery

            </label>

          </div>


          <button
            type="submit"
            class="place-order">

            PLACE ORDER ON WHATSAPP

          </button>


        </form>

      </div>

    </div>

  </main>


  <!-- IMAGE MODAL -->

  <div
    class="image-modal"
    id="imageModal"
    onclick="closeImageZoom(event)">

    <button
      class="image-modal-close"
      type="button"
      onclick="closeImageZoom(event)">

      ×

    </button>

    <img
      id="zoomedImage"
      src=""
      alt=""
      onclick="toggleImageZoom(event)">

  </div>


  <footer>

    © 2026
    <strong>Craftio Gifts</strong>.

    All Rights Reserved.

  </footer>


  <script>


    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://hujwsdixdxhofwhibjff.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_cdGRvXXS3R663XWC6ZjgaQ_s1LuK2hf";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       WHATSAPP
    ========================= */

    const WHATSAPP_NUMBER =
      "923360763055";


    /* =========================
       URL
    ========================= */

    const urlParams =
      new URLSearchParams(
        window.location.search
      );

    const isBuyNow =
      urlParams.get(
        "buyNow"
      ) === "true";


    /* =========================
       CART
    ========================= */

    let cart = [];


    function getStoredCart() {

      try {

        const key =
          isBuyNow
            ? "craftioBuyNow"
            : "craftioCart";

        return (
          JSON.parse(
            localStorage.getItem(
              key
            )
          ) || []
        );

      } catch (error) {

        return [];

      }

    }


    function saveStoredCart() {

      const key =
        isBuyNow
          ? "craftioBuyNow"
          : "craftioCart";


      localStorage.setItem(
        key,
        JSON.stringify(
          cart
        )
      );

    }


    /* =========================
       HELPERS
    ========================= */

    function escapeHtml(value) {

      return String(
        value ?? ""
      )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

    }


    function getActualPrice(
      product
    ) {

      const regularPrice =
        Number(
          product.price || 0
        );

      const salePrice =
        Number(
          product.sale_price || 0
        );


      if (
        product.sale === true &&
        salePrice > 0
      ) {

        return salePrice;

      }


      return regularPrice;

    }


    function getCustomizationHtml(
      customization
    ) {

      if (
        !customization ||
        typeof customization !== "object"
      ) {

        return "";

      }


      const labels = {

        name:
          "Name",

        date:
          "Date",

        profile:
          "Profile Information",

        groomName:
          "Groom Name",

        brideName:
          "Bride Name",

        nikkahDate:
          "Nikkah Date",

        details:
          "Other Details"

      };


      let html = "";

      Object.keys(
        customization
      ).forEach(
        function(key) {

          const value =
            String(
              customization[key] ??
              ""
            ).trim();


          if (!value) {
            return;
          }


          const label =
            labels[key] ||
            key;


          html += `

            <div>

              <strong>
                ${escapeHtml(
                  label
                )}:
              </strong>

              ${escapeHtml(
                value
              )}

            </div>

          `;

        }
      );


      if (!html) {
        return "";
      }


      return `

        <div class="custom-details">

          ${html}

        </div>

      `;

    }


    /* =========================
       LOAD PRODUCTS
    ========================= */

    async function loadProducts() {

      const orderItems =
        document.getElementById(
          "orderItems"
        );

      const totalBox =
        document.getElementById(
          "totalBox"
        );


      cart =
        getStoredCart();


      if (
        cart.length === 0
      ) {

        orderItems.innerHTML = `

          <div class="empty-message">

            <h3>
              Your cart is empty.
            </h3>

            <p>
              Please select a product first.
            </p>

          </div>

        `;

        totalBox.innerHTML = "";

        return;

      }


      const ids =
        [
          ...new Set(
            cart.map(
              item =>
                item.id
            )
          )
        ];


      const {
        data,
        error
      } =

        await supabaseClient

          .from("products")

          .select("*")

          .in(
            "id",
            ids
          )

          .eq(
            "active",
            true
          );


      if (
        error
      ) {

        console.error(
          error
        );

        orderItems.innerHTML = `

          <div class="empty-message">

            <h3>
              Unable to load your order.
            </h3>

            <p>
              Please refresh the page.
            </p>

          </div>

        `;

        totalBox.innerHTML = "";

        return;

      }


      const products =
        data || [];


      renderOrder(
        products
      );

    }


    /* =========================
       RENDER ORDER
    ========================= */

    function renderOrder(
      products
    ) {

      const orderItems =
        document.getElementById(
          "orderItems"
        );

      const totalBox =
        document.getElementById(
          "totalBox"
        );


      orderItems.innerHTML =
        "";


      let total =
        0;

      let validItems =
        0;


      cart.forEach(
        function(item) {

          const product =
            products.find(
              function(p) {

                return (
                  p.id ===
                  item.id
                );

              }
            );


          if (!product) {
            return;
          }


          validItems++;


          const quantity =
            Number(
              item.quantity || 1
            );


          const actualPrice =
            getActualPrice(
              product
            );


          const itemTotal =
            actualPrice *
            quantity;


          total +=
            itemTotal;


          orderItems.innerHTML += `

            <div class="order-item">

              <img
                src="${escapeHtml(
                  product.image_url || ""
                )}"
                alt="${escapeHtml(
                  product.name || ""
                )}"
                onclick="openImageZoom(
                  this.src,
                  this.alt
                )">


              <div class="order-item-info">

                <h3>

                  ${escapeHtml(
                    product.name || ""
                  )}

                </h3>


                <p>

                  Rs.
                  ${actualPrice.toLocaleString()}
                  ×
                  ${quantity}

                </p>


                <div
                  class="order-item-price">

                  Rs.
                  ${itemTotal.toLocaleString()}

                </div>


                ${
                  getCustomizationHtml(
                    item.customization
                  )
                }


                ${
                  !isBuyNow
                  ? `

                    <div
                      class="quantity-controls">

                      <button
                        type="button"
                        onclick="changeQuantity(
                          '${escapeJs(item.id)}',
                          -1
                        )">

                        −

                      </button>


                      <strong>
                        ${quantity}
                      </strong>


                      <button
                        type="button"
                        onclick="changeQuantity(
                          '${escapeJs(item.id)}',
                          1
                        )">

                        +

                      </button>


                      <button
                        type="button"
                        class="remove-btn"
                        onclick="removeItem(
                          '${escapeJs(item.id)}'
                        )">

                        Remove

                      </button>

                    </div>

                  `
                  : ""
                }

              </div>

            </div>

          `;

        }
      );


      if (
        validItems === 0
      ) {

        cart = [];

        saveStoredCart();


        orderItems.innerHTML = `

          <div class="empty-message">

            <h3>
              Your cart is empty.
            </h3>

          </div>

        `;

        totalBox.innerHTML = "";

        return;

      }


      totalBox.innerHTML = `

        <div class="total-box">

          <span>
            Total
          </span>

          <span>
            Rs.
            ${total.toLocaleString()}
          </span>

        </div>

      `;

    }


    /* =========================
       CHANGE QUANTITY
    ========================= */

    async function changeQuantity(
      productId,
      amount
    ) {

      const item =
        cart.find(
          function(entry) {

            return (
              entry.id ===
              productId
            );

          }
        );


      if (!item) {
        return;
      }


      item.quantity =
        Number(
          item.quantity || 1
        ) + amount;


      if (
        item.quantity <= 0
      ) {

        cart =
          cart.filter(
            function(entry) {

              return (
                entry.id !==
                productId
              );

            }
          );

      }


      saveStoredCart();


      await loadProducts();

    }


    /* =========================
       REMOVE ITEM
    ========================= */

    async function removeItem(
      productId
    ) {

      cart =
        cart.filter(
          function(item) {

            return (
              item.id !==
              productId
            );

          }
        );


      saveStoredCart();


      await loadProducts();

    }


    /* =========================
       PLACE ORDER
    ========================= */

    document
      .getElementById(
        "checkoutForm"
      )
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          if (
            cart.length === 0
          ) {

            alert(
              "Your cart is empty. Please select a product first."
            );

            return;

          }


          const fullName =
            document.getElementById(
              "fullName"
            ).value.trim();


          const phone =
            document.getElementById(
              "phone"
            ).value.trim();


          const address =
            document.getElementById(
              "address"
            ).value.trim();


          const city =
            document.getElementById(
              "city"
            ).value.trim();


          const ids =
            [
              ...new Set(
                cart.map(
                  item =>
                    item.id
                )
              )
            ];


          const {
            data,
            error
          } =

            await supabaseClient

              .from("products")

              .select("*")

              .in(
                "id",
                ids
              )

              .eq(
                "active",
                true
              );


          if (
            error ||
            !data
          ) {

            alert(
              "Unable to load products. Please refresh and try again."
            );

            return;

          }


          let total =
            0;


          let message =
            "🛍️ *NEW ORDER - CRAFTIO GIFTS*\n\n";


          message +=
            "*Customer Details*\n";

          message +=
            "Name: " +
            fullName +
            "\n";

          message +=
            "Phone: " +
            phone +
            "\n";

          message +=
            "Address: " +
            address +
            "\n";

          message +=
            "City: " +
            city +
            "\n\n";


          message +=
            "*Order Details*\n";


          cart.forEach(
            function(item, index) {

              const product =
                data.find(
                  function(p) {

                    return (
                      p.id ===
                      item.id
                    );

                  }
                );


              if (!product) {
                return;
              }


              const quantity =
                Number(
                  item.quantity || 1
                );


              const actualPrice =
                getActualPrice(
                  product
                );


              const itemTotal =
                actualPrice *
                quantity;


              total +=
                itemTotal;


              message +=
                (index + 1) +
                ". " +
                product.name +
                "\n";


              message +=
                "Category: " +
                (
                  product.category ||
                  ""
                ) +
                "\n";


              message +=
                "Qty: " +
                quantity +
                "\n";


              message +=
                "Price: Rs. " +
                itemTotal +
                "\n";


              const customization =
                item.customization;


              if (
                customization &&
                typeof customization ===
                "object"
              ) {

                const labels = {

                  name:
                    "Name",

                  date:
                    "Date",

                  profile:
                    "Profile Information",

                  groomName:
                    "Groom Name",

                  brideName:
                    "Bride Name",

                  nikkahDate:
                    "Nikkah Date",

                  details:
                    "Other Details"

                };


                Object.keys(
                  customization
                ).forEach(
                  function(key) {

                    const value =
                      String(
                        customization[key] ??
                        ""
                      ).trim();


                    if (!value) {
                      return;
                    }


                    message +=
                      (
                        labels[key] ||
                        key
                      ) +
                      ": " +
                      value +
                      "\n";

                  }
                );

              }


              message +=
                "\n";

            }
          );


          message +=
            "*TOTAL: Rs. " +
            total +
            "*\n\n";


          message +=
            "Payment: Cash on Delivery";


          const whatsappURL =
            "https://wa.me/" +
            WHATSAPP_NUMBER +
            "?text=" +
            encodeURIComponent(
              message
            );


          if (isBuyNow) {

            localStorage.removeItem(
              "craftioBuyNow"
            );

          } else {

            localStorage.removeItem(
              "craftioCart"
            );

          }


          /*
            Direct navigation avoids
            popup-blocker problems.
          */

          window.location.href =
            whatsappURL;

        }
      );


    /* =========================
       IMAGE ZOOM
    ========================= */

    function openImageZoom(
      src,
      alt
    ) {

      const modal =
        document.getElementById(
          "imageModal"
        );

      const zoomedImage =
        document.getElementById(
          "zoomedImage"
        );


      zoomedImage.src =
        src;

      zoomedImage.alt =
        alt || "";


      zoomedImage.classList.remove(
        "zoomed"
      );


      modal.classList.add(
        "active"
      );


      document.body.style.overflow =
        "hidden";

    }


    function toggleImageZoom(
      event
    ) {

      event.stopPropagation();


      document
        .getElementById(
          "zoomedImage"
        )
        .classList
        .toggle(
          "zoomed"
        );

    }


    function closeImageZoom(
      event
    ) {

      const modal =
        document.getElementById(
          "imageModal"
        );


      if (
        event &&
        event.target !== modal &&
        !event.target.classList.contains(
          "image-modal-close"
        )
      ) {

        return;

      }


      modal.classList.remove(
        "active"
      );


      document
        .getElementById(
          "zoomedImage"
        )
        .classList
        .remove(
          "zoomed"
        );


      document.body.style.overflow =
        "";

    }


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Escape"
        ) {

          document
            .getElementById(
              "imageModal"
            )
            .classList
            .remove(
              "active"
            );

          document
            .getElementById(
              "zoomedImage"
            )
            .classList
            .remove(
              "zoomed"
            );

          document.body.style.overflow =
            "";

        }

      }
    );


    /* =========================
       START
    ========================= */

    loadProducts();

  </script>

</body>
