<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Checkout | Craftio Gifts</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f7f7f7;
      color:#111;
    }

    nav{
      background:#111;
      color:white;
      padding:18px 7%;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .logo-text{
      font-size:25px;
      font-weight:800;
      letter-spacing:1px;
    }

    .logo-text span{
      color:#00aef0;
    }

    .nav-links{
      display:flex;
      gap:25px;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      font-size:15px;
      font-weight:600;
    }

    .nav-links a:hover{
      color:#00aef0;
    }

    .checkout-page{
      max-width:1100px;
      margin:50px auto;
      padding:0 20px;
    }

    .page-title{
      text-align:center;
      margin-bottom:35px;
    }

    .page-title h1{
      font-size:38px;
      margin-bottom:8px;
    }

    .page-title h1 span{
      color:#00aef0;
    }

    .checkout-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:30px;
    }

    .box{
      background:white;
      border-radius:15px;
      padding:30px;
      box-shadow:0 8px 25px rgba(0,0,0,.05);
    }

    .box h2{
      margin-bottom:25px;
      font-size:23px;
    }

    .order-item{
      display:flex;
      gap:15px;
      padding:15px 0;
      border-bottom:1px solid #eee;
    }

    .order-item img{
      width:85px;
      height:85px;
      object-fit:contain;
      border-radius:8px;
      background:#f7f7f7;
      padding:5px;
      cursor:zoom-in;
      flex-shrink:0;
    }

    .order-item-info{
      flex:1;
    }

    .order-item-info h3{
      font-size:15px;
      line-height:1.35;
      margin-bottom:8px;
    }

    .order-item-info p{
      color:#666;
      margin-bottom:5px;
    }

    .order-item-price{
      color:#00aef0;
      font-weight:800;
    }

    .custom-summary{
      margin-top:12px;
      padding:10px;
      background:#f8fcfe;
      border:1px solid #d8eef7;
      border-radius:7px;
      font-size:13px;
      line-height:1.6;
    }

    .custom-summary strong{
      color:#111;
    }

    .whatsapp-note{
      margin-top:10px;
      padding:10px;
      background:white;
      border-left:4px solid #00aef0;
      color:#444;
      line-height:1.5;
      font-size:13px;
      border-radius:5px;
    }

    .quantity-controls{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:8px;
    }

    .quantity-controls button{
      width:28px;
      height:28px;
      border:1px solid #ccc;
      background:white;
      border-radius:5px;
      cursor:pointer;
      font-weight:bold;
    }

    .remove-btn{
      width:auto !important;
      padding:0 8px;
      color:#d00;
    }

    .total-box{
      margin-top:25px;
      border-top:2px solid #111;
      padding-top:18px;
      display:flex;
      justify-content:space-between;
      font-size:21px;
      font-weight:800;
    }

    .form-group{
      margin-bottom:18px;
    }

    .form-group label{
      display:block;
      margin-bottom:7px;
      font-weight:700;
    }

    .form-group input,
    .form-group textarea{
      width:100%;
      padding:13px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:15px;
      outline:none;
      font-family:Arial,sans-serif;
    }

    .form-group input:focus,
    .form-group textarea:focus{
      border-color:#00aef0;
    }

    .form-group textarea{
      height:110px;
      resize:vertical;
    }

    .payment-box{
      margin-top:25px;
      padding:18px;
      background:#f5fbfe;
      border:1px solid #d8eef7;
      border-radius:10px;
    }

    .payment-box h3{
      margin-bottom:10px;
    }

    .payment-option{
      display:flex;
      gap:8px;
      align-items:center;
    }

    .place-order{
      width:100%;
      border:none;
      background:#111;
      color:white;
      padding:16px;
      border-radius:9px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      margin-top:25px;
    }

    .place-order:hover{
      background:#333;
    }

    .back-products{
      display:inline-block;
      margin-top:20px;
      color:#555;
      text-decoration:none;
      font-weight:600;
    }

    .back-products:hover{
      color:#00aef0;
    }

    .empty-message{
      text-align:center;
      padding:30px 10px;
      color:#777;
    }

    .image-modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.88);
      display:none;
      align-items:center;
      justify-content:center;
      padding:25px;
      z-index:3000;
      overflow:auto;
    }

    .image-modal.active{
      display:flex;
    }

    .image-modal img{
      max-width:92vw;
      max-height:90vh;
      width:auto;
      height:auto;
      object-fit:contain;
      border-radius:10px;
      cursor:zoom-in;
      transition:transform .25s ease;
      touch-action:pinch-zoom;
      box-shadow:0 10px 40px rgba(0,0,0,.4);
    }

    .image-modal img.zoomed{
      transform:scale(1.7);
      cursor:zoom-out;
    }

    .image-modal-close{
      position:fixed;
      top:18px;
      right:22px;
      width:45px;
      height:45px;
      border:none;
      border-radius:50%;
      background:white;
      color:#111;
      font-size:32px;
      line-height:1;
      cursor:pointer;
      z-index:3001;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    footer{
      background:#111;
      color:white;
      text-align:center;
      padding:25px;
      font-size:14px;
      margin-top:60px;
    }

    footer strong{
      color:#00aef0;
    }

    @media(max-width:800px){

      nav{
        flex-direction:column;
        gap:15px;
      }

      .checkout-grid{
        grid-template-columns:1fr;
      }

      .page-title h1{
        font-size:30px;
      }

      .box{
        padding:20px;
      }

    }

  </style>

</head>

<body>

<nav>

  <div class="logo-text">
    CRAFTIO <span>GIFTS</span>
  </div>

  <div class="nav-links">

    <a href="index.html">
      Home
    </a>

    <a href="products.html">
      Products
    </a>

  </div>

</nav>


<main class="checkout-page">

  <div class="page-title">

    <h1>
      Complete Your <span>Order</span>
    </h1>

    <p>
      Please enter your delivery details below.
    </p>

  </div>


  <div class="checkout-grid">

    <div class="box">

      <h2>
        🛒 Your Order
      </h2>

      <div id="orderItems"></div>

      <div id="totalBox"></div>

      <a
        href="products.html"
        class="back-products">
        ← Continue Shopping
      </a>

    </div>


    <div class="box">

      <h2>
        Delivery Details
      </h2>

      <form id="checkoutForm">

        <div class="form-group">

          <label>
            Full Name
          </label>

          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required>

        </div>


        <div class="form-group">

          <label>
            Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="03XXXXXXXXX"
            required>

        </div>


        <div class="form-group">

          <label>
            Complete Delivery Address
          </label>

          <textarea
            id="address"
            placeholder="House no, street, area..."
            required></textarea>

        </div>


        <div class="form-group">

          <label>
            City
          </label>

          <input
            type="text"

        <div class="payment-box">

          <h3>
            Payment Method

          <label class="payment-option">

              type="radio"

      </form>

  </div>

</main>


<div
  class="image-modal"
  id="imageModal"
  onclick="closeImageZoom(event)">

  <button
    class="image-modal-close"
    type="button"
    onclick="closeImageZoom(event)">
    ×
  </button>

  <img
    id="zoomedImage"
    src=""
    alt=""
    onclick="toggleImageZoom(event)">

</div>


<footer>

  © 2026 <strong>Craftio Gifts</strong>.
  All Rights Reserved.

</footer>


<script>

const SUPABASE_URL =
  "https://hujwsdixdxhofwhibffj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_cdGRvXXS3R663XWC6ZjgaQ_s1LuK2hf";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const WHATSAPP_NUMBER =
  "923360763055";


const urlParams =
  new URLSearchParams(
    window.location.search
  );

const isBuyNow =
  urlParams.get("buyNow") === "true";


let cart = [];

let products = [];


/* =========================
   PRODUCT GROUPS
========================= */

const GROUPS = {

  led: [
    "led-picture-frame-1",
    "led-picture-frame-2",
    "led-picture-frame-3"
  ],

  birthdayFrame: [
    "birthday-frame-1",
    "birthday-frame-2",
    "birthday-frame-3",
    "birthday-frame-4",
    "birthday-frame-5",
    "birthday-frame-6",
    "birthday-frame-7",
    "birthday-frame-8"
  ],

  pictureFrame: [
    "picture-frame-1",
    "picture-frame-2"
  ],

  mug: [
    "mug-1",
    "mug-2"
  ],

  birthdayMug: [
    "birthday-mug-2",
    "birthday-mug-3"
  ],

  magicMug: [
    "magic-mug-1",
    "magic-mug-2"
  ],

  social: [
    "social-card-1"
  ],

  friendship: [
    "friendship-card-1",
    "friendship-card-2"
  ],

  eye: [
    "necklace-1",
    "necklace-2",
    "necklace-3",
    "necklace-4",
    "necklace-5",
    "necklace-6",
    "necklace-7"
  ],

  plate: [
    "nikkah-plaque-1",
    "nikkah-plaque-2"
  ],

  trendy: [
    "trendy-chart-1"
  ],

  keychain: [
    "name-keychain-1"
  ],

  pvc: [
    "pvc-card-1"
  ],

  lamp: [
    "moon-lamp-1",
    "moon-lamp-2"
  ]

};


function getProductType(product){

  for(const type in GROUPS){

    if(GROUPS[type].includes(product.id)){
      return type;
    }

  }

  return null;
}


/* =========================
   WHATSAPP INSTRUCTION
========================= */

function getWhatsAppInstruction(product){

  const type =
    getProductType(product);

  if(
    type === "led" ||
    type === "birthdayFrame" ||
    type === "pictureFrame" ||
    type === "mug" ||
    type === "birthdayMug" ||
    type === "magicMug" ||
    type === "friendship" ||
    type === "lamp"
  ){
    return "Please send your picture on WhatsApp after placing your order.";
  }

  if(type === "eye"){
    return "Please send your eye picture on WhatsApp after placing your order.";
  }

  if(type === "social"){
    return "Please send your profile information on WhatsApp after placing your order.";
  }

  if(type === "trendy"){
    return "Please send your pictures on WhatsApp after placing your order.";
  }

  if(type === "pvc"){
    return "Please send your picture and details on WhatsApp after placing your order.";
  }

  if(type === "plate"){
    return "Your wedding details will be sent on WhatsApp with your order.";
  }

  if(type === "keychain"){
    return "Your keychain name will be sent on WhatsApp with your order.";
  }

  return "";
}


/* =========================
   PRICE
========================= */

function getProductPrice(product){

  if(
    product.sale === true &&
    Number(product.sale_price) > 0
  ){
    return Number(product.sale_price);
  }

  return Number(product.price) || 0;
}


/* =========================
   GET CART
========================= */

function getStoredCart(){

  const key =
    isBuyNow
      ? "craftioBuyNow"
      : "craftioCart";

  return JSON.parse(
    localStorage.getItem(key)
  ) || [];
}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  cart = getStoredCart();

  if(!cart.length){

    renderOrder();
    return;
  }

  const ids =
    [
      ...new Set(
        cart.map(item => item.id)
      )
    ];

  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .in("id", ids);

  if(error){

    console.error(error);

    document.getElementById(
      "orderItems"
    ).innerHTML =
      `<div class="empty-message">
        Unable to load your order.
      </div>`;

    return;
  }

  products = data || [];

  renderOrder();
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   CUSTOMIZATION LABELS
========================= */

const CUSTOM_LABELS = {

  name: "Name",

  date: "Date",

  profileInfo: "Profile Information",

  groomName: "Groom Name",

  brideName: "Bride Name",

  nikahDate: "Nikkah Date",

  otherDetails: "Other Details"

};


/* =========================
   CUSTOMIZATION HTML
========================= */

function getCustomizationHtml(customization){

  if(
    !customization ||
    Object.keys(customization).length === 0
  ){
    return "";
  }

  let html =
    `<div class="custom-summary">
       <strong>Customization:</strong><br>`;

  for(const key in customization){

    const value =
      customization[key];

    if(!value) continue;

    html += `
      ${CUSTOM_LABELS[key] || key}:
      ${escapeHtml(value)}
      <br>
    `;

  }

  html += `</div>`;

  return html;
}


/* =========================
   DISPLAY ORDER
========================= */

function renderOrder(){

  const orderItems =
    document.getElementById(
      "orderItems"
    );

  const totalBox =
    document.getElementById(
      "totalBox"
    );

  if(!cart.length){

    orderItems.innerHTML = `
      <div class="empty-message">

        <h3>
          Your cart is empty.
        </h3>

        <p>
          Please select a product first.
        </p>

      </div>
    `;

    totalBox.innerHTML = "";

    return;
  }

  let total = 0;

  orderItems.innerHTML = "";

  cart.forEach(
    (item,index) => {

      const product =
        products.find(
          p => p.id === item.id
        );

      if(!product) return;

      const price =
        getProductPrice(product);

      const itemTotal =
        price *
        Number(item.quantity);

      total += itemTotal;

      const customHtml =
        getCustomizationHtml(
          item.customization
        );

      const note =
        getWhatsAppInstruction(
          product
        );

      orderItems.innerHTML += `

        <div class="order-item">

          <img
            src="${escapeHtml(product.image_url || "")}"
            alt="${escapeHtml(product.name)}"
            onclick="openImageZoom(
              '${escapeHtml(product.image_url || "")}',
              '${escapeHtml(product.name)}'
            )"
          >

          <div class="order-item-info">

            <h3>
              ${escapeHtml(product.name)}
            </h3>

            <p>
              Rs. ${
                price > 0
                  ? price.toLocaleString("en-PK")
                  : "Price will be updated"
              }
              × ${item.quantity}
            </p>

            <div class="order-item-price">
              ${
                itemTotal > 0
                  ? "Rs. " +
                    itemTotal.toLocaleString("en-PK")
                  : "Price will be updated"
              }
            </div>

            ${customHtml}

            ${
              note
                ? `
                <div class="whatsapp-note">
                  ${note}
                </div>
                `
                : ""
            }

            <div class="quantity-controls">

              <button
                onclick="changeQuantity(
                  '${product.id}',
                  -1
                )">
                −
              </button>

              <strong>
                ${item.quantity}
              </strong>

              <button
                onclick="changeQuantity(
                  '${product.id}',
                  1
                )">
                +
              </button>

              <button
                class="remove-btn"
                onclick="removeItem(
                  '${product.id}'
                )">
                Remove
              </button>

            </div>

          </div>

        </div>

      `;

    }
  );


  totalBox.innerHTML = `

    <div class="total-box">

      <span>
        Total
      </span>

      <span>
        ${
          total > 0
            ? "Rs. " +
              total.toLocaleString("en-PK")
            : "Price will be updated"
        }
      </span>

    </div>

  `;
}


/* =========================
   IMAGE ZOOM
========================= */

function openImageZoom(src,alt){

  const modal =
    document.getElementById(
      "imageModal"
    );

  const image =
    document.getElementById(
      "zoomedImage"
    );

  image.src = src;
  image.alt = alt || "";

  image.classList.remove("zoomed");

  modal.classList.add("active");

  document.body.style.overflow =
    "hidden";
}


function toggleImageZoom(event){

  event.stopPropagation();

  document
    .getElementById("zoomedImage")
    .classList.toggle("zoomed");
}


function closeImageZoom(event){

  const modal =
    document.getElementById(
      "imageModal"
    );

  if(
    event &&
    event.target !== modal &&
    !event.target.classList.contains(
      "image-modal-close"
    )
  ){
    return;
  }

  modal.classList.remove("active");

  document
    .getElementById("zoomedImage")
    .classList.remove("zoomed");

  document.body.style.overflow = "";
}


document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      const modal =
        document.getElementById(
          "imageModal"
        );

      if(modal.classList.contains("active")){

        modal.classList.remove("active");

        document
          .getElementById("zoomedImage")
          .classList.remove("zoomed");

        document.body.style.overflow = "";
      }

    }

  }
);


/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(
  productId,
  amount
){

  const item =
    cart.find(
      item =>
        item.id === productId
    );

  if(!item) return;

  item.quantity += amount;

  if(item.quantity <= 0){

    cart =
      cart.filter(
        item =>
          item.id !== productId
      );

  }

  saveCurrentCart();

  renderOrder();
}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(productId){

  cart =
    cart.filter(
      item =>
        item.id !== productId
    );

  saveCurrentCart();

  renderOrder();
}


/* =========================
   SAVE CART
========================= */

function saveCurrentCart(){

  const key =
    isBuyNow
      ? "craftioBuyNow"
      : "craftioCart";

  localStorage.setItem(
    key,
    JSON.stringify(cart)
  );
}


/* =========================
   TOTAL
========================= */

function getTotal(){

  let total = 0;

  cart.forEach(item => {

    const product =
      products.find(
        p => p.id === item.id
      );

    if(!product) return;

    const price =
      getProductPrice(product);

    total +=
      price *
      Number(item.quantity);

  });

  return total;
}


/* =========================
   WHATSAPP ORDER
========================= */

document.getElementById(
  "checkoutForm"
).addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    if(!cart.length){

      alert(
        "Your cart is empty. Please select a product first."
      );

      return;
    }


    const fullName =
      document
        .getElementById("fullName")
        .value
        .trim();

    const phone =
      document
        .getElementById("phone")
        .value
        .trim();

    const address =
      document
        .getElementById("address")
        .value
        .trim();

    const city =
      document
        .getElementById("city")
        .value
        .trim();


    const total =
      getTotal();


    const lines = [];

    lines.push(
      "🛍️ NEW ORDER - CRAFTIO GIFTS"
    );

    lines.push("");

    lines.push(
      "CUSTOMER DETAILS"
    );

    lines.push(
      "Name: " + fullName
    );

    lines.push(
      "Phone: " + phone
    );

    lines.push(
      "Address: " + address
    );

    lines.push(
      "City: " + city
    );

    lines.push("");

    lines.push(
      "ORDER DETAILS"
    );


    cart.forEach(
      (item,index) => {

        const product =
          products.find(
            p => p.id === item.id
          );

        if(!product) return;

        const price =
          getProductPrice(product);

        const itemTotal =
          price *
          Number(item.quantity);

        lines.push("");

        lines.push(
          (index + 1) +
          ". " +
          product.name
        );

        lines.push(
          "Qty: " +
          item.quantity
        );

        lines.push(
          "Price: " +
          (
            itemTotal > 0
              ? "Rs. " +
                itemTotal.toLocaleString("en-PK")
              : "Price will be updated"
          )
        );


        const custom =
          item.customization || {};

        if(
          Object.keys(custom).length
        ){

          lines.push(
            "Customization:"
          );

          for(
            const key in custom
          ){

            if(!custom[key]) continue;

            lines.push(
              (CUSTOM_LABELS[key] || key) +
              ": " +
              custom[key]
            );

          }

        }


        const note =
          getWhatsAppInstruction(
            product
          );

        if(note){

          lines.push(
            "Note: " +
            note
          );

        }

      }
    );


    lines.push("");

    lines.push(
      "TOTAL: " +
      (
        total > 0
          ? "Rs. " +
            total.toLocaleString("en-PK")
          : "Price will be updated"
      )
    );

    lines.push("");

    lines.push(
      "Payment: Cash on Delivery"
    );


    const whatsappURL =
      "https://wa.me/" +
      WHATSAPP_NUMBER +
      "?text=" +
      encodeURIComponent(
        lines.join("\n")
      );


    if(isBuyNow){

      localStorage.removeItem(
        "craftioBuyNow"
      );

    }else{

      localStorage.removeItem(
        "craftioCart"
      );

    }


    window.open(
      whatsappURL,
      "_blank"
    );

  }
);

loadProducts();

</script>
