<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products | Craftio Gifts</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    a {
      text-decoration: none;
    }

    /* =========================
       NAVBAR
    ========================= */

    nav {
      background: #111;
      color: #fff;
      padding: 17px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 2000;
    }

    .logo-link {
      color: #fff;
      display: inline-block;
    }

    .logo-text {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .logo-text span {
      color: #00aef0;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a,
    .products-menu-btn {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .nav-links a:hover,
    .products-menu-btn:hover {
      color: #00aef0;
    }

    /* =========================
       CART
    ========================= */

    .cart-button {
      background: #00aef0 !important;
      color: #fff !important;
      padding: 9px 14px;
      border-radius: 8px;
    }

    .cart-button:hover {
      background: #008fc5 !important;
    }

    /* =========================
       CATEGORY DROPDOWN
       IMPORTANT:
       OUTSIDE NAV
    ========================= */

    .category-dropdown {
      position: fixed;
      top: 78px;
      right: 6%;
      width: 320px;
      max-height: 70vh;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e9e9e9;
      border-radius: 12px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.20);
      padding: 10px;
      display: none;
      z-index: 5000;
    }

    .category-dropdown.active {
      display: block;
    }

    .category-dropdown a {
      display: block;
      width: 100%;
      color: #111;
      padding: 11px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }

    .category-dropdown a:hover {
      background: #eefaff;
      color: #008fc5;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-wrap {
      position: relative;
    }

    .search-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      background: #181818;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .search-btn svg {
      width: 18px;
      height: 18px;
    }

    .search-panel {
      position: absolute;
      top: 47px;
      right: 0;
      width: 340px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.20);
      border: 1px solid #eee;
      padding: 12px;
      display: none;
      z-index: 5000;
    }

    .search-panel.active {
      display: block;
    }

    .search-input {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 12px;
      outline: none;
      font-size: 14px;
    }

    .search-input:focus {
      border-color: #00aef0;
    }

    .search-results {
      margin-top: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .search-result {
      width: 100%;
      border: none;
      background: #fff;
      text-align: left;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .search-result:hover {
      background: #f4fbff;
    }

    .search-result-name {
      color: #111;
      font-size: 13px;
      font-weight: 700;
    }

    .search-result-cat {
      color: #777;
      font-size: 10px;
      text-align: right;
    }

    .no-results {
      padding: 12px 8px;
      color: #777;
      font-size: 13px;
    }

    /* =========================
       MOBILE MENU
    ========================= */

    .mobile-menu-btn {
      display: none;
      width: 38px;
      height: 38px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.25);
      background: #181818;
      color: #fff;
      font-size: 23px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mobile-category-menu {
      display: none;
    }

    /* =========================
       PAGE HEADER
    ========================= */

    .page-header {
      text-align: center;
      padding: 58px 20px 30px;
    }

    .page-header h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .page-header p {
      color: #666;
      font-size: 17px;
      line-height: 1.5;
    }

    .active-category {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e9f8ff;
      color: #008fc5;
      font-size: 12px;
      font-weight: 800;
    }

    /* =========================
       PRODUCTS GRID
    ========================= */

    .products-grid {
      max-width: 1200px;
      margin: 20px auto 70px;
      padding: 0 25px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
      align-items: stretch;
    }

    .product-card {
      background: #fff;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      transition: 0.25s;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-image-wrap {
      width: 100%;
      height: 260px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      padding: 8px;
    }

    .product-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 175px;
    }

    .product-info h3 {
      font-size: 17px;
      line-height: 1.4;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .product-price {
      color: #00aef0;
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .price-note {
      color: #777;
      font-size: 12px;
      font-weight: 700;
    }

    .product-actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
    }

    .view-btn,
    .cart-btn {
      flex: 1;
      border: none;
      border-radius: 7px;
      padding: 11px 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
    }

    .view-btn {
      background: #111;
      color: #fff;
    }

    .view-btn:hover {
      background: #333;
    }

    .cart-btn {
      background: #00aef0;
      color: #fff;
    }

    .cart-btn:hover {
      background: #008fc5;
    }

    .empty-category {
      grid-column: 1 / -1;
      background: #fff;
      border-radius: 15px;
      padding: 60px 20px;
      text-align: center;
      color: #777;
      box-shadow: 0 8px 25px rgba(0,0,0,0.05);
    }

    /* =========================
       CART OVERLAY
    ========================= */

    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      justify-content: flex-end;
      z-index: 7000;
    }

    .cart-overlay.active {
      display: flex;
    }

    .cart-panel {
      width: 420px;
      max-width: 100%;
      height: 100%;
      background: #fff;
      padding: 25px;
      overflow-y: auto;
    }

    .cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .cart-header h2 {
      font-size: 27px;
    }

    .close-cart {
      background: transparent;
      border: none;
      font-size: 30px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-details h4 {
      font-size: 13px;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .cart-item-price {
      color: #00aef0;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity-controls button {
      width: 28px;
      height: 28px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 5px;
      cursor: pointer;
    }

    .remove-btn {
      border: none;
      background: none;
      color: #e33;
      cursor: pointer;
      margin-top: 7px;
      font-size: 12px;
    }

    .cart-total {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
    }

    .checkout-btn {
      width: 100%;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      padding: 15px;
      background: #00aef0;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background: #008fc5;
    }

    .empty-cart {
      text-align: center;
      color: #777;
      padding: 50px 10px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 25px;
      font-size: 14px;
    }

    footer strong {
      color: #00aef0;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 1000px) {

      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }

    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 750px) {

      nav {
        padding: 14px 18px;
      }

      .nav-links {
        display: none;
      }

      .mobile-menu-btn {
        display: flex;
      }

      .nav-right {
        gap: 8px;
      }

      /* DESKTOP CATEGORY MENU HIDDEN */

      .category-dropdown {
        display: none !important;
      }

      /* MOBILE CATEGORY MENU */

      .mobile-category-menu {
        position: fixed;
        top: 62px;
        right: 18px;
        width: 300px;
        max-height: 75vh;
        overflow-y: auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 18px 45px rgba(0,0,0,0.20);
        padding: 10px;
        z-index: 6000;
      }

      .mobile-category-menu.active {
        display: block;
      }

      .mobile-category-menu a {
        display: block;
        color: #111;
        padding: 11px 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
      }

      .mobile-category-menu a:hover {
        background: #eefaff;
        color: #008fc5;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        padding: 0 14px;
      }

      .product-image-wrap {
        height: 230px;
      }

      .product-info {
        padding: 14px;
        min-height: 170px;
      }

      .product-info h3 {
        font-size: 15px;
      }

    }

    /* =========================
       SMALL MOBILE
    ========================= */

    @media (max-width: 500px) {

      .logo-text {
        font-size: 20px;
      }

      .page-header {
        padding: 40px 15px 25px;
      }

      .page-header h1 {
        font-size: 31px;
      }

      .page-header p {
        font-size: 15px;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 0 10px;
      }

      .product-image-wrap {
        height: 185px;
      }

      .product-card img {
        padding: 5px;
      }

      .product-info {
        padding: 10px;
        min-height: 155px;
      }

      .product-info h3 {
        font-size: 13px;
      }

      .product-price {
        font-size: 15px;
      }

      .view-btn,
      .cart-btn {
        font-size: 9.5px;
        padding: 9px 4px;
      }

      .search-panel {
        position: fixed;
        left: 10px;
        right: 10px;
        top: 65px;
        width: auto;
      }

      .mobile-category-menu {
        right: 10px;
        width: calc(100vw - 20px);
      }

    }

  </style>

</head>

       PRODUCTS
  ========================= -->

       CART
  ========================= -->

        class="checkout-btn"

    /* =========================
       IMAGE PATH
    ========================= */

    function imageSrc(fileName) {

      return encodeURI(fileName);

    }


    /* =========================
       IMAGE FALLBACK
    ========================= */

    function setImageFallback(img, product) {

      if (
        !product.fallbackImages ||
        product.fallbackImages.length === 0
      ) {
        return;
      }


      let currentIndex =
        Number(
          img.dataset.fallbackIndex || 0
        );


      currentIndex++;


      if (
        currentIndex >=
        product.fallbackImages.length
      ) {
        return;
      }


      img.dataset.fallbackIndex =
        currentIndex;


      img.src =
        imageSrc(
          product.fallbackImages[
            currentIndex
          ]
        );

    }


    /* =========================
       CATEGORY URL
    ========================= */

    function categoryUrl(category) {

      return (
        "products.html?category=" +
        encodeURIComponent(category)
      );

    }


    /* =========================
       SELECTED CATEGORY
    ========================= */

    function getSelectedCategory() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      return (
        params.get("category") ||
        "ALL"
      );

    }


    /* =========================
       CATEGORY MENUS
    ========================= */

    function populateCategoryMenus() {

      const desktop =
        document.getElementById(
          "categoryDropdown"
        );


      const mobile =
        document.getElementById(
          "mobileCategoryMenu"
        );


      const all =
        `<a href="${categoryUrl("ALL")}">
          ALL PRODUCTS
        </a>`;


      const links =
        categories
          .map(
            category =>
              `<a href="${categoryUrl(category)}">
                ${category}
              </a>`
          )
          .join("");


      desktop.innerHTML =
        all + links;


      mobile.innerHTML =
        all + links;

    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts() {

      const selected =
        getSelectedCategory();


      const grid =
        document.getElementById(
          "productsGrid"
        );


      const label =
        document.getElementById(
          "activeCategoryLabel"
        );


      const visibleProducts =
        selected === "ALL"

          ? products

          : products.filter(
              product =>
                product.category ===
                selected
            );


      label.textContent =
        selected === "ALL"
          ? "ALL PRODUCTS"
          : selected;


      if (
        visibleProducts.length === 0
      ) {

        grid.innerHTML = `

          <div class="empty-category">

            No products have been added in
            <strong>${selected}</strong>
            yet.

          </div>

        `;

        return;

      }


      grid.innerHTML =
        visibleProducts
          .map(
            product => `

              <div class="product-card">

                <div class="product-image-wrap">

                  <img
                    src="${imageSrc(product.image)}"
                    alt="${product.name}"
                    loading="lazy"
                    onerror="setImageFallback(this, ${JSON.stringify(product).replace(/"/g, '&quot;')})"
                  >

                </div>


                <div class="product-info">

                  <h3>
                    ${product.name}
                  </h3>


                  <div class="product-price">

                    <span class="price-note">
                      Price will be updated
                    </span>

                  </div>


                  <div class="product-actions">

                    <button
                      type="button"
                      class="view-btn"
                      onclick="openProduct('${product.id}')">

                      VIEW PRODUCT

                    </button>


                    <button
                      type="button"
                      class="cart-btn"
                      onclick="addToCart('${product.id}')">

                      🛒 ADD

                    </button>

                  </div>

                </div>

              </div>

            `
          )
          .join("");

    }


    /* =========================
       OPEN PRODUCT
    ========================= */

    function openProduct(productId) {

      window.location.href =
        "product.html?product=" +
        encodeURIComponent(
          productId
        );

    }


    /* =========================

    ========================= */

    const searchBtn =
      document.getElementById(
        "searchBtn"
      );


    const searchPanel =
      document.getElementById(
        "searchPanel"
      );


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const searchResults =
      document.getElementById(
        "searchResults"
      );


    function renderSearchResults(
      query
    ) {

      const q =
        query
          .trim()
          .toLowerCase();


      if (!q) {

        searchResults.innerHTML =
          "";

        return;

      }


      const matches =
        products
          .filter(
            product =>

              product.name
                .toLowerCase()
                .includes(q)

              ||

              product.category
                .toLowerCase()
                .includes(q)

          )
          .slice(0, 8);


      if (
        matches.length === 0
      ) {

        searchResults.innerHTML = `

          <div class="no-results">
            No matching product found.
          </div>

        `;

        return;

      }


      searchResults.innerHTML =
        matches
          .map(
            product => `

              <button
                type="button"
                class="search-result"
                onclick="openProduct('${product.id}')">

                <span class="search-result-name">
                  ${product.name}
                </span>

                <span class="search-result-cat">
                  ${product.category}
                </span>

              </button>

            `
          )
          .join("");

    }

    /* =========================
       CART
    ========================= */

    function getCart() {

      try {

        return (
          JSON.parse(
            localStorage.getItem(
              "craftioCart"
            )
          ) || []
        );

      } catch (error) {

        return [];

      }

    }


    function saveCart(cart) {

      localStorage.setItem(
        "craftioCart",
        JSON.stringify(cart)
      );

    }


    function addToCart(productId) {

      const cart =
        getCart();


      const existing =
        cart.find(
          item =>
            item.id ===
            productId
        );


      if (existing) {

        existing.quantity += 1;

      } else {

        cart.push({
          id: productId,
          quantity: 1
        });

      }


      saveCart(cart);

      updateCartCount();

      renderCart();

      openCart();

    }


    function updateCartCount() {

      const count =
        getCart().reduce(
          function(total, item) {

            return (
              total +
              (
                Number(
                  item.quantity
                ) || 0
              )
            );

          },
          0
        );


      document
        .getElementById(
          "cartCount"
        )
        .textContent = count;

    }


    function changeQuantity(
      productId,
      change
    ) {

      const cart =
        getCart();


      const item =
        cart.find(
          i =>
            i.id ===
            productId
        );


      if (!item) return;


      item.quantity +=
        change;


      if (
        item.quantity <= 0
      ) {

        const index =
          cart.findIndex(
            i =>
              i.id ===
              productId
          );


        cart.splice(
          index,
          1
        );

      }


      saveCart(cart);

      updateCartCount();

      renderCart();

    }


    function removeFromCart(
      productId
    ) {

      const cart =
        getCart().filter(
          item =>
            item.id !==
            productId
        );


      saveCart(cart);

      updateCartCount();

      renderCart();

    }


    function renderCart() {

      const cart =
        getCart();


      const cartItems =
        document.getElementById(
          "cartItems"
        );


      const cartTotal =
        document.getElementById(
          "cartTotal"
        );


      if (
        cart.length === 0
      ) {

        cartItems.innerHTML = `

          <div class="empty-cart">
            Your cart is empty.
          </div>

        `;


        cartTotal.textContent =
          "Rs. 0";


        return;

      }


      cartItems.innerHTML =
        "";


      let count =
        0;


      cart.forEach(
        function(item) {

          const product =
            products.find(
              p =>
                p.id ===
                item.id
            );


          if (!product) {
            return;
          }


          count++;


          cartItems.innerHTML += `

            <div class="cart-item">

              <img
                src="${imageSrc(product.image)}"
                alt="${product.name}"
                onerror="setImageFallback(this, ${JSON.stringify(product).replace(/"/g, '&quot;')})"
              >


              <div class="cart-item-details">

                <h4>
                  ${product.name}
                </h4>


                <div class="cart-item-price">
                  Price will be updated
                </div>


                <div class="quantity-controls">

                  <button
                    type="button"
                    onclick="changeQuantity('${product.id}', -1)">

                    −

                  </button>


                  <span>
                    ${item.quantity}
                  </span>


                  <button
                    type="button"
                    onclick="changeQuantity('${product.id}', 1)">

                    +

                  </button>

                </div>


                <button
                  type="button"
                  class="remove-btn"
                  onclick="removeFromCart('${product.id}')">

                  Remove

                </button>

              </div>

            </div>

          `;

        }
      );


      cartTotal.textContent =
        "Price to be confirmed";

    }


    function openCart() {

      document
        .getElementById(
          "cartOverlay"
        )
        .classList
        .add("active");


      renderCart();

    }


    function closeCart() {

      document

    }
