<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products | Craftio Gifts</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    nav {
      background: #111;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo-text {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo-text span {
      color: #00aef0;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: #00aef0;
    }

    .cart-button {
      background: #00aef0;
      padding: 9px 15px;
      border-radius: 8px;
    }

    .page-header {
      text-align: center;
      padding: 60px 20px 30px;
    }

    .page-header h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .page-header p {
      color: #666;
      font-size: 17px;
    }

    .products-grid {
      max-width: 1200px;
      margin: 20px auto 70px;
      padding: 0 25px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
    }

    .product-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      transition: 0.3s;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
    }

    .product-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 190px;
    }

    .product-info h3 {
      font-size: 18px;
      line-height: 1.35;
      margin-bottom: 12px;
      min-height: 49px;
    }

    .product-price {
      color: #00aef0;
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .view-btn,
    .cart-btn {
      flex: 1;
      padding: 11px 8px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .view-btn {
      background: #111;
      color: white;
    }

    .view-btn:hover {
      background: #333;
    }

    .cart-btn {
      background: #00aef0;
      color: white;
    }

    .cart-btn:hover {
      background: #008fc5;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      font-size: 14px;
    }

    footer strong {
      color: #00aef0;
    }

    /* =========================
       CART OVERLAY
    ========================= */

    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      justify-content: flex-end;
      z-index: 2000;
    }

    .cart-overlay.active {
      display: flex;
    }

    .cart-panel {
      width: 420px;
      max-width: 100%;
      height: 100%;
      background: white;
      padding: 25px;
      overflow-y: auto;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .cart-header h2 {
      font-size: 27px;
    }

    .close-cart {
      border: none;
      background: none;
      font-size: 30px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item img {
      width: 75px;
      height: 75px;
      object-fit: cover;
      border-radius: 8px;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-details h4 {
      font-size: 14px;
      margin-bottom: 7px;
    }

    .cart-item-price {
      color: #00aef0;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity-controls button {
      width: 28px;
      height: 28px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .remove-btn {
      margin-top: 7px;
      border: none;
      background: none;
      color: #e33;
      cursor: pointer;
      font-size: 12px;
    }

    .cart-total {
      margin-top: 25px;
      font-size: 21px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
    }

    .checkout-btn {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #00aef0;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background: #008fc5;
    }

    .empty-cart {
      text-align: center;
      color: #777;
      padding: 50px 10px;
    }

    @media (max-width: 1000px) {

      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }

    }

    @media (max-width: 750px) {

      nav {
        flex-direction: column;
        gap: 15px;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 500px) {

      .page-header {
        padding-top: 40px;
      }

      .page-header h1 {
        font-size: 32px;
      }

      .products-grid {
        grid-template-columns: 1fr;
        padding: 0 15px;
      }

      .product-card img {
        height: 300px;
      }

    }

  </style>

</head>

<body>


  <!-- =========================
       NAVBAR
  ========================= -->

  <nav>

    <div class="logo-text">
      CRAFTIO <span>GIFTS</span>
    </div>

    <div class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a href="products.html">
        Products
      </a>

      <a href="#contact" class="cart-button"
         onclick="openCart(); return false;">
        🛒 Cart (<span id="cartCount">0</span>)
      </a>

    </div>

  </nav>


  <!-- =========================
       PAGE HEADER
  ========================= -->

  <section class="page-header">

    <h1>
      Our Products
    </h1>

    <p>
      Personalized gifts made specially for your special moments.
    </p>

  </section>


  <!-- =========================
       PRODUCTS
  ========================= -->

  <section
    class="products-grid"
    id="productsGrid">
  </section>


  <!-- =========================
       CART
  ========================= -->

  <div
    class="cart-overlay"
    id="cartOverlay"
    onclick="closeCart()">

    <div
      class="cart-panel"
      onclick="event.stopPropagation()">

      <div class="cart-header">

        <h2>
          Your Cart
        </h2>

        <button
          class="close-cart"
          onclick="closeCart()">
          ×
        </button>

      </div>

      <div id="cartItems"></div>

      <div
        class="cart-total">

        <span>
          Total:
        </span>

        <span id="cartTotal">
          Rs. 0
        </span>

      </div>

      <button
        class="checkout-btn"
        onclick="window.location.href='checkout.html'">
        PROCEED TO CHECKOUT
      </button>

    </div>

  </div>


  <footer>

    © 2026 <strong>Craftio Gifts</strong>.
    All Rights Reserved.

  </footer>


  <script>

    const products = [

      {
        id: "led-photo-frame",
        name: "CUSTOMIZED LED PHOTO FRAME",
        price: 2000,
        image: "Light%20frame.jpeg"
      },

      {
        id: "birthday-frame",
        name: "CUSTOMIZED BIRTHDAY FRAME",
        price: 999,
        image: "Birthday%20Frame.jpeg"
      },

      {
        id: "birthday-mug",
        name: "CUSTOMIZED BIRTHDAY MUG",
        price: 999,
        image: "birthday%20mug.jpeg"
      },

      {
        id: "led-heart-lamp",
        name: "CUSTOMIZED LED HEART LAMP",
        price: 2500,
        image: "MOON%20PICTURE%20FRAME.jpeg"
      },

      {
        id: "nikkah-signature-frame",
        name: "CUSTOMIZED NIKKAH SIGNATURE FRAME",
        price: 999,
        image: "nikkah%20frame.jpeg"
      },

      {
        id: "magic-mug",
        name: "CUSTOMIZED MAGIC MUG",
        price: 1400,
        image: "magic%20mug.jpeg"
      },

      {
        id: "wedding-ring-plaque",
        name: "CUSTOMIZED WEDDING RING PLAQUE",
        price: 2500,
        image: "NIKKAH%20PLAQUE.jpeg"
      },

      {
        id: "trendy-charts",
        name: "CUSTOMIZED TRENDY CHARTS",
        price: 1350,
        image: "TRENDY%20CHARTS.jpeg"
      },

      {
        id: "eye-pendant-necklace",
        name: "CUSTOMIZED EYE PENDANT NECKLACE",
        price: 1300,
        image: "EYE%20NECKLACE.jpeg"
      },

      {
        id: "picture-frame",
        name: "CUSTOMIZED PICTURE FRAME",
        price: 900,
        image: "PICTURE%20FRAME.jpg"
      },

      {
        id: "friendship-license-card",
        name: "CUSTOMIZED FRIENDSHIP LICENSE CARD",
        price: 900,
        image: "FRIENSHIP%20LICENSE%20CAED.jpeg"
      },

      {
        id: "name-key-chain",
        name: "CUSTOMIZED NAME KEY CHAIN",
        price: 800,
        image: "NAME%20KEY.jpeg"
      },

      {
        id: "picture-mug-colors",
        name: "CUSTOMIZED PICTURE MUG WITH DIFFERENT COLORS",
        price: 1350,
        image: "CUSTOMIZED%20MUG%20WITH%20COLORS.jpg"
      },

      {
        id: "pubg-mobile-card",
        name: "CUSTOMIZED PUBG MOBILE CARD",
        price: 800,
        image: "PUBG%20CARD.jpeg"
      },

      {
        id: "snapchat-tiktok-instagram-card",
        name: "CUSTOMIZED SNAPCHAT TIKTOK & INSTAGRAM CARD",
        price: 800,
        image: "SNAPCHAT%20CARD.jpeg"
      },

      {
        id: "pvc-card",
        name: "CUSTOMIZED PVC CARD",
        price: 850,
        image: "PVC%20CARD.jpg"
      }

    ];


    /* =========================
       DISPLAY PRODUCTS
    ========================= */

    const productsGrid =
      document.getElementById("productsGrid");


    products.forEach(product => {

      productsGrid.innerHTML += `

        <div class="product-card">

          <img
            src="${product.image}"
            alt="${product.name}"
          >

          <div class="product-info">

            <h3>
              ${product.name}
            </h3>

            <div class="product-price">
              Rs. ${product.price}
            </div>

            <div class="product-actions">

              <button
                class="view-btn"
                onclick="window.location.href='product.html?product=${product.id}'">
                VIEW PRODUCT
              </button>

              <button
                class="cart-btn"
                onclick="addToCart('${product.id}')">
                🛒 ADD
              </button>

            </div>

          </div>

        </div>

      `;

    });


    /* =========================
       CART
    ========================= */

    function getCart() {

      return JSON.parse(
        localStorage.getItem("craftioCart")
      ) || [];

    }


    function saveCart(cart) {

      localStorage.setItem(
        "craftioCart",
        JSON.stringify(cart)
      );

    }


    function addToCart(productId) {

      const cart = getCart();

      const existing =
        cart.find(item => item.id === productId);


      if (existing) {

        existing.quantity += 1;

      } else {

        cart.push({
          id: productId,
          quantity: 1
        });

      }


      saveCart(cart);

      updateCartCount();

      renderCart();

      openCart();

    }


    function updateCartCount() {

      const cart = getCart();

      const count =
        cart.reduce(
          (total, item) =>
            total + item.quantity,
          0
        );


      document.getElementById(
        "cartCount"
      ).textContent = count;

    }


    function changeQuantity(
      productId,
      change
    ) {

      const cart = getCart();

      const item =
        cart.find(
          item => item.id === productId
        );


      if (!item) return;


      item.quantity += change;


      if (item.quantity <= 0) {

        const index =
          cart.findIndex(
            item => item.id === productId
          );

        cart.splice(index, 1);

      }


      saveCart(cart);

      updateCartCount();

      renderCart();

    }


    function removeFromCart(productId) {

      let cart = getCart();

      cart =
        cart.filter(
          item => item.id !== productId
        );


      saveCart(cart);

      updateCartCount();

      renderCart();

    }


    function renderCart() {

      const cart = getCart();

      const cartItems =
        document.getElementById("cartItems");

      const cartTotal =
        document.getElementById("cartTotal");


      if (cart.length === 0) {

        cartItems.innerHTML = `
          <div class="empty-cart">
            Your cart is empty.
          </div>
        `;

        cartTotal.textContent =
          "Rs. 0";

        return;

      }


      let total = 0;


      cartItems.innerHTML = "";


      cart.forEach(item => {

        const product =
          products.find(
            p => p.id === item.id
          );


        if (!product) return;


        const itemTotal =
          product.price * item.quantity;


        total += itemTotal;


        cartItems.innerHTML += `

          <div class="cart-item">

            <img
              src="${product.image}"
              alt="${product.name}"
            >

            <div class="cart-item-details">

              <h4>
                ${product.name}
              </h4>

              <div class="cart-item-price">
                Rs. ${itemTotal}
              </div>

              <div class="quantity-controls">

                <button
                  onclick="changeQuantity('${product.id}', -1)">
                  −
                </button>

                <span>
                  ${item.quantity}
                </span>

                <button
                  onclick="changeQuantity('${product.id}', 1)">
                  +
                </button>

              </div>

              <button
                class="remove-btn"
                onclick="removeFromCart('${product.id}')">
                Remove
              </button>

            </div>

          </div>

        `;

      });


      cartTotal.textContent =
        "Rs. " + total;

    }


    function openCart() {

      document
        .getElementById("cartOverlay")
        .classList.add("active");

      renderCart();

    }


    function closeCart() {

      document
        .getElementById("cartOverlay")
        .classList.remove("active");

    }


    updateCartCount();

    renderCart();

  </script>

</body>
</html>
