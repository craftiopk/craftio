<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Products | Craftio Gifts</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.png">

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    a {
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }


    /* =========================
       NAVBAR
    ========================= */

    nav {
      background: #111;
      color: #fff;

      padding: 17px 6%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      position: sticky;
      top: 0;

      z-index: 2000;
    }


    .logo-link {
      color: #fff;
      display: inline-block;
    }


    .logo-text {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
    }


    .logo-text span {
      color: #00aef0;
    }


    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }


    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }


    .nav-links a,
    .products-menu-btn {
      color: #fff;

      font-size: 15px;
      font-weight: 700;

      background: transparent;
      border: none;

      cursor: pointer;
    }


    .nav-links a:hover,
    .products-menu-btn:hover {
      color: #00aef0;
    }


    /* =========================
       CART
    ========================= */

    .cart-button {
      background: #00aef0 !important;
      color: #fff !important;

      padding: 9px 14px;

      border-radius: 8px;
    }


    .cart-button:hover {
      background: #008fc5 !important;
    }


    /* =========================
       CATEGORY DROPDOWN
    ========================= */

    .category-dropdown {
      position: fixed;

      top: 78px;
      right: 6%;

      width: 320px;

      max-height: 70vh;

      overflow-y: auto;

      background: #fff;

      border: 1px solid #e9e9e9;

      border-radius: 12px;

      box-shadow:
        0 18px 45px rgba(0,0,0,0.20);

      padding: 10px;

      display: none;

      z-index: 5000;
    }


    .category-dropdown.active {
      display: block;
    }


    .category-dropdown a {
      display: block;

      width: 100%;

      padding: 11px 12px;

      border-radius: 8px;

      color: #111 !important;

      font-size: 13px;

      font-weight: 700;

      line-height: 1.3;
    }


    .category-dropdown a:hover {
      background: #eefaff;
      color: #008fc5 !important;
    }


    /* =========================
       SEARCH
    ========================= */

    .search-wrap {
      position: relative;
    }


    .search-btn {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,0.25);

      background: #181818;

      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }


    .search-btn svg {
      width: 18px;
      height: 18px;
    }


    .search-panel {
      position: absolute;

      top: 47px;
      right: 0;

      width: 340px;

      background: #fff;

      border-radius: 12px;

      box-shadow:
        0 18px 45px rgba(0,0,0,0.20);

      border: 1px solid #eee;

      padding: 12px;

      display: none;

      z-index: 5000;
    }


    .search-panel.active {
      display: block;
    }


    .search-input {
      width: 100%;

      border: 1px solid #ddd;

      border-radius: 9px;

      padding: 12px;

      outline: none;

      font-size: 14px;
    }


    .search-input:focus {
      border-color: #00aef0;
    }


    .search-results {
      margin-top: 8px;

      max-height: 300px;

      overflow-y: auto;
    }


    .search-result {
      width: 100%;

      border: none;

      background: #fff;

      text-align: left;

      border-radius: 8px;

      padding: 10px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 8px;

      cursor: pointer;
    }


    .search-result:hover {
      background: #f4fbff;
    }


    .search-result-name {
      color: #111;

      font-size: 13px;

      font-weight: 700;
    }


    .search-result-cat {
      color: #777;

      font-size: 10px;

      text-align: right;
    }


    .no-results {
      padding: 12px 8px;

      color: #777;

      font-size: 13px;
    }


    /* =========================
       MOBILE MENU
    ========================= */

    .mobile-menu-btn {
      display: none;

      width: 38px;
      height: 38px;

      border-radius: 9px;

      border:
        1px solid
        rgba(255,255,255,0.25);

      background: #181818;

      color: #fff;

      font-size: 23px;

      align-items: center;
      justify-content: center;

      cursor: pointer;
    }


    .mobile-category-menu {
      display: none;
    }


    /* =========================
       HEADER
    ========================= */

    .page-header {
      text-align: center;

      padding:
        58px 20px 30px;
    }


    .page-header h1 {
      font-size: 42px;

      margin-bottom: 12px;
    }


    .page-header p {
      color: #666;

      font-size: 17px;

      line-height: 1.5;
    }


    .active-category {
      display: inline-block;

      margin-top: 15px;

      padding: 8px 14px;

      border-radius: 999px;

      background: #e9f8ff;

      color: #008fc5;

      font-size: 12px;

      font-weight: 800;
    }


    /* =========================
       LOADING
    ========================= */

    .loading-box {
      grid-column: 1 / -1;

      background: #fff;

      border-radius: 15px;

      padding: 60px 20px;

      text-align: center;

      color: #777;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.05);
    }


    .error-box {
      grid-column: 1 / -1;

      background: #fff;

      border-radius: 15px;

      padding: 60px 20px;

      text-align: center;

      color: #d33;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.05);
    }


    /* =========================
       PRODUCTS GRID
    ========================= */

    .products-grid {
      max-width: 1200px;

      margin:
        20px auto 70px;

      padding:
        0 25px;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 25px;

      align-items: stretch;
    }


    .product-card {
      background: #fff;

      border-radius: 15px;

      overflow: hidden;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.06);

      transition: 0.25s;

      display: flex;

      flex-direction: column;
    }


    .product-card:hover {
      transform: translateY(-5px);
    }


    .product-image-wrap {
      width: 100%;

      height: 260px;

      background: #fff;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;
    }


    .product-image-wrap img {
      width: 100%;

      height: 100%;

      object-fit: contain;

      padding: 8px;

      display: block;
    }


    .product-info {
      padding: 18px;

      display: flex;

      flex-direction: column;

      flex: 1;

      min-height: 175px;
    }


    .product-info h3 {
      font-size: 17px;

      line-height: 1.4;

      font-weight: 700;

      margin-bottom: 12px;
    }


    .product-price {
      color: #00aef0;

      font-size: 18px;

      font-weight: 800;

      margin-bottom: 15px;
    }


    .old-price {
      color: #999;

      text-decoration: line-through;

      font-size: 13px;

      margin-right: 7px;

      font-weight: 600;
    }


    .sale-price {
      color: #00aef0;

      font-size: 18px;

      font-weight: 800;
    }


    .price-note {
      color: #777;

      font-size: 12px;

      font-weight: 700;
    }


    .sale-badge {
      display: inline-block;

      width: fit-content;

      margin-bottom: 9px;

      padding: 5px 8px;

      background: #111;

      color: #fff;

      border-radius: 999px;

      font-size: 9px;

      font-weight: 800;
    }


    .product-actions {
      margin-top: auto;

      display: flex;

      gap: 8px;
    }


    .view-btn,
    .cart-btn {
      flex: 1;

      border: none;

      border-radius: 7px;

      padding: 11px 7px;

      cursor: pointer;

      font-size: 12px;

      font-weight: 800;
    }


    .view-btn {
      background: #111;

      color: #fff;
    }


    .view-btn:hover {
      background: #333;
    }


    .cart-btn {
      background: #00aef0;

      color: #fff;
    }


    .cart-btn:hover {
      background: #008fc5;
    }


    .empty-category {
      grid-column: 1 / -1;

      background: #fff;

      border-radius: 15px;

      padding: 60px 20px;

      text-align: center;

      color: #777;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.05);
    }


    /* =========================
       CART
    ========================= */

    .cart-overlay {
      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,0.55);

      display: none;

      justify-content: flex-end;

      z-index: 7000;
    }


    .cart-overlay.active {
      display: flex;
    }


    .cart-panel {
      width: 420px;

      max-width: 100%;

      height: 100%;

      background: #fff;

      padding: 25px;

      overflow-y: auto;
    }


    .cart-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 25px;
    }


    .cart-header h2 {
      font-size: 27px;
    }


    .close-cart {
      border: none;

      background: transparent;

      font-size: 30px;

      cursor: pointer;
    }


    .cart-item {
      display: flex;

      gap: 15px;

      padding: 15px 0;

      border-bottom:
        1px solid #eee;
    }


    .cart-item img {
      width: 75px;

      height: 75px;

      object-fit: contain;

      background: #fff;

      border:
        1px solid #eee;

      border-radius: 8px;

      flex-shrink: 0;
    }


    .cart-item-details {
      flex: 1;
    }


    .cart-item-details h4 {
      font-size: 13px;

      line-height: 1.35;

      margin-bottom: 7px;
    }


    .cart-item-price {
      color: #00aef0;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 8px;
    }


    .quantity-controls {
      display: flex;

      align-items: center;

      gap: 8px;
    }


    .quantity-controls button {
      width: 28px;

      height: 28px;

      border:
        1px solid #ccc;

      background: #fff;

      border-radius: 5px;

      cursor: pointer;
    }


    .remove-btn {
      border: none;

      background: none;

      color: #e33;

      cursor: pointer;

      margin-top: 7px;

      font-size: 12px;
    }


    .cart-total {
      margin-top: 25px;

      display: flex;

      justify-content: space-between;

      gap: 10px;

      font-size: 20px;

      font-weight: 800;
    }


    .checkout-btn {
      width: 100%;

      margin-top: 20px;

      border: none;

      border-radius: 8px;

      padding: 15px;

      background: #00aef0;

      color: #fff;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;
    }


    .checkout-btn:hover {
      background: #008fc5;
    }


    .empty-cart {
      text-align: center;

      color: #777;

      padding: 50px 10px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #111;

      color: #fff;

      text-align: center;

      padding: 25px;

      font-size: 14px;
    }


    footer strong {
      color: #00aef0;
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 1000px) {

      .products-grid {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 750px) {

      nav {
        padding: 14px 18px;
      }


      .nav-links {
        display: none;
      }


      .mobile-menu-btn {
        display: flex;
      }


      .nav-right {
        gap: 8px;
      }


      .category-dropdown {
        display: none !important;
      }


      .mobile-category-menu {
        position: fixed;

        top: 62px;

        right: 18px;

        width: 300px;

        max-height: 75vh;

        overflow-y: auto;

        background: #fff;

        border-radius: 12px;

        box-shadow:
          0 18px 45px rgba(0,0,0,0.20);

        padding: 10px;

        z-index: 6000;
      }


      .mobile-category-menu.active {
        display: block;
      }


      .mobile-category-menu a {
        display: block;

        color: #111;

        padding: 11px 12px;

        border-radius: 8px;

        font-size: 13px;

        font-weight: 700;
      }


      .mobile-category-menu a:hover {
        background: #eefaff;

        color: #008fc5;
      }


      .products-grid {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 14px;

        padding:
          0 14px;
      }


      .product-image-wrap {
        height: 230px;
      }


      .product-info {
        padding: 14px;

        min-height: 170px;
      }


      .product-info h3 {
        font-size: 15px;
      }

    }


    /* =========================
       SMALL MOBILE
    ========================= */

    @media (max-width: 500px) {

      .logo-text {
        font-size: 20px;
      }


      .page-header {
        padding:
          40px 15px 25px;
      }


      .page-header h1 {
        font-size: 31px;
      }


      .page-header p {
        font-size: 15px;
      }


      .products-grid {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 10px;

        padding:
          0 10px;
      }


      .product-image-wrap {
        height: 185px;
      }


      .product-info {
        padding: 10px;

        min-height: 155px;
      }


      .product-info h3 {
        font-size: 13px;
      }


      .product-price {
        font-size: 15px;
      }


      .sale-price {
        font-size: 15px;
      }


      .view-btn,
      .cart-btn {
        font-size: 9.5px;

        padding:
          9px 4px;
      }


      .search-panel {
        position: fixed;

        left: 10px;

        right: 10px;

        top: 65px;

        width: auto;
      }


      .mobile-category-menu {
        right: 10px;

        width:
          calc(100vw - 20px);
      }


      .cart-panel {
        padding: 18px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       NAVBAR
  ========================= -->

  <nav>


    <a
      href="index.html"
      class="logo-link">

      <div class="logo-text">

        CRAFTIO
        <span>GIFTS</span>

      </div>

    </a>


    <div class="nav-right">


      <!-- DESKTOP NAV -->

      <div class="nav-links">


        <a href="index.html">

          Home

        </a>


        <button
          type="button"
          class="products-menu-btn"
          id="productsMenuBtn">

          Products ▾

        </button>


        <a href="index.html#contact">

          Contact

        </a>


        <a
          href="#"
          class="cart-button"
          onclick="openCart(); return false;">

          🛒 Cart
          (<span id="cartCount">0</span>)

        </a>


      </div>


      <!-- SEARCH -->

      <div class="search-wrap">


        <button
          type="button"
          class="search-btn"
          id="searchBtn"
          aria-label="Search products">


          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round">


            <circle
              cx="11"
              cy="11"
              r="7">
            </circle>


            <line
              x1="16.5"
              y1="16.5"
              x2="21"
              y2="21">
            </line>


          </svg>


        </button>


        <div
          class="search-panel"
          id="searchPanel">


          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Search products..."
            autocomplete="off">


          <div
            id="searchResults"
            class="search-results">
          </div>


        </div>


      </div>


      <!-- MOBILE -->

      <button
        type="button"
        class="mobile-menu-btn"
        id="mobileMenuBtn"
        aria-label="Open categories">

        ☰

      </button>


    </div>


  </nav>


  <!-- =========================
       DESKTOP CATEGORY MENU
    ========================= -->

  <div
    class="category-dropdown"
    id="categoryDropdown">
  </div>


  <!-- =========================
       MOBILE CATEGORY MENU
  ========================= -->

  <div
    class="mobile-category-menu"
    id="mobileCategoryMenu">
  </div>


  <!-- =========================
       HEADER
  ========================= -->

  <section class="page-header">


    <h1>
      Our Products
    </h1>


    <p>
      Personalized gifts made specially for your special moments.
    </p>


    <div
      class="active-category"
      id="activeCategoryLabel">

      ALL PRODUCTS

    </div>


  </section>


  <!-- =========================
       PRODUCTS
  ========================= -->

  <section
    class="products-grid"
    id="productsGrid">


    <div class="loading-box">

      Loading products...

    </div>


  </section>


  <!-- =========================
       CART
  ========================= -->

  <div
    class="cart-overlay"
    id="cartOverlay"
    onclick="closeCart()">


    <div
      class="cart-panel"
      onclick="event.stopPropagation()">


      <div class="cart-header">


        <h2>
          Your Cart
        </h2>


        <button
          type="button"
          class="close-cart"
          onclick="closeCart()">

          ×

        </button>


      </div>


      <div id="cartItems"></div>


      <div class="cart-total">


        <span>
          Total:
        </span>


        <span id="cartTotal">
          Rs. 0
        </span>


      </div>


      <button
        type="button"
        class="checkout-btn"
        onclick="window.location.href='checkout.html'">

        PROCEED TO CHECKOUT

      </button>


    </div>

  </div>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    © 2026
    <strong>Craftio Gifts</strong>.
    All Rights Reserved.

  </footer>


  <script>


    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://hujwsdixdxhofwhibjff.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_cdGRvXXS3R663XWC6ZjgaQ_s1LuK2hf";


    const supabaseClient =
      window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY

      );


    /* =====================================
       CATEGORIES
    ===================================== */

    const defaultCategories = [

      "ISLAMIC COLLECTION",

      "LED PICTURE FRAME",

      "ANNIVERSARY FRAMES",

      "NIKKAH FRAMES",

      "BIRTHDAY FRAMES",

      "PICTURE FRAMES",

      "MUG COLLECTION",

      "MAGIC MUGS",

      "NEW BORN FRAMES",

      "SNAPCHAT / TIKTOK / INSTAGRAM PVC CARDS",

      "FRIENDSHIP LICENCE CARD",

      "EYE NECKLACE",

      "WEDDING RING PLATES",

      "TRENDY CHARTS",

      "NAME KEYCHAINS",

      "PVC CARD",

      "MAGIC LAMPS"

    ];


    let categories = [
      ...defaultCategories
    ];


    let products = [];


    /* =====================================
       IMAGE URL
    ===================================== */

    function imageUrl(url) {

      if (!url) {
        return "";
      }

      return url;

    }


    /* =====================================
       GET CATEGORY
    ===================================== */

    function getSelectedCategory() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      return (
        params.get("category") ||
        "ALL"
      );

    }


    /* =====================================
       CATEGORY URL
    ===================================== */

    function categoryUrl(
      category
    ) {

      return (
        "products.html?category=" +
        encodeURIComponent(
          category
        )
      );

    }


    /* =====================================
       CATEGORY MENUS
    ===================================== */

    function populateCategoryMenus() {

      const desktop =
        document.getElementById(
          "categoryDropdown"
        );


      const mobile =
        document.getElementById(
          "mobileCategoryMenu"
        );


      let html = `

        <a href="${categoryUrl("ALL")}">

          ALL PRODUCTS

        </a>

      `;


      categories.forEach(
        function(category) {

          html += `

            <a
              href="${categoryUrl(category)}">

              ${escapeHtml(category)}

            </a>

          `;

        }
      );


      /* =========================
         CONTACT US
      ========================= */

      html += `

        <a
          href="index.html#follow-craftio">

          CONTACT US

        </a>

      `;


      desktop.innerHTML =
        html;


      mobile.innerHTML =
        html;

    }


    /* =====================================
       LOAD PRODUCTS FROM SUPABASE
    ===================================== */

    async function loadProducts() {

      const grid =
        document.getElementById(
          "productsGrid"
        );


      grid.innerHTML = `

        <div class="loading-box">

          Loading products...

        </div>

      `;


      const {
        data,
        error
      } =
        await supabaseClient

          .from("products")

          .select("*")

          .eq(
            "active",
            true
          )

          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          error
        );


        grid.innerHTML = `

          <div class="error-box">

            Unable to load products.

            <br>

            Please refresh the page.

          </div>

        `;


        return;

      }


      products =
        data || [];


      renderProducts();

      updateCartCount();

      renderCart();

    }


    /* =====================================
       PRODUCT PRICE HTML
    ===================================== */

    function productPriceHtml(
      product
    ) {

      const price =
        Number(
          product.price || 0
        );


      const salePrice =
        product.sale_price !== null &&
        product.sale_price !== undefined

          ?

          Number(
            product.sale_price
          )

          :

          0;


      if (
        product.sale === true &&
        salePrice > 0 &&
        price > 0 &&
        salePrice < price
      ) {

        return `

          <span class="old-price">

            Rs. ${price.toLocaleString()}

          </span>


          <span class="sale-price">

            Rs. ${salePrice.toLocaleString()}

          </span>

        `;

      }


      if (price > 0) {

        return `

          Rs. ${price.toLocaleString()}

        `;

      }


      return `

        <span class="price-note">

          Price will be updated

        </span>

      `;

    }


    /* =====================================
       GET ACTUAL PRICE
    ===================================== */

    function getProductPrice(
      product
    ) {

      const price =
        Number(
          product.price || 0
        );


      if (
        product.sale === true
        &&
        product.sale_price !== null
        &&
        product.sale_price !== undefined
        &&
        Number(
          product.sale_price
        ) > 0
      ) {

        return Number(
          product.sale_price
        );

      }


      return price;

    }


    /* =====================================
       RENDER PRODUCTS
    ===================================== */

    function renderProducts() {

      const grid =
        document.getElementById(
          "productsGrid"
        );


      const label =
        document.getElementById(
          "activeCategoryLabel"
        );


      const selected =
        getSelectedCategory();


      const visibleProducts =
        selected === "ALL"

          ?

          products

          :

          products.filter(
            function(product) {

              return (
                product.category ===
                selected
              );

            }
          );


      label.textContent =
        selected === "ALL"
          ? "ALL PRODUCTS"
          : selected;


      if (
        visibleProducts.length === 0
      ) {

        grid.innerHTML = `

          <div class="empty-category">

            No products found in
            <strong>
              ${escapeHtml(selected)}
            </strong>.

          </div>

        `;


        return;

      }


      grid.innerHTML =
        visibleProducts
          .map(
            function(product) {

              return `

                <div class="product-card">


                  <div
                    class="product-image-wrap">


                    <img
                      src="${imageUrl(
                        product.image_url
                      )}"
                      alt="${escapeHtml(
                        product.name
                      )}"
                      loading="lazy">


                  </div>


                  <div
                    class="product-info">


                    ${
                      product.sale === true
                      &&
                      Number(
                        product.sale_price || 0
                      ) > 0

                      ?

                      `

                        <div class="sale-badge">

                          SALE

                        </div>

                      `

                      :

                      ""

                    }


                    <h3>

                      ${escapeHtml(
                        product.name
                      )}

                    </h3>


                    <div
                      class="product-price">

                      ${productPriceHtml(
                        product
                      )}

                    </div>


                    <div
                      class="product-actions">


                      <button
                        type="button"
                        class="view-btn"
                        onclick="openProduct(
                          '${escapeJs(
                            product.id
                          )}'
                        )">

                        VIEW PRODUCT

                      </button>


                      <button
                        type="button"
                        class="cart-btn"
                        onclick="addToCart(
                          '${escapeJs(
                            product.id
                          )}'
                        )">

                        🛒 ADD

                      </button>


                    </div>


                  </div>

                </div>

              `;

            }
          )
          .join("");

    }


    /* =====================================
       OPEN PRODUCT
    ===================================== */

    function openProduct(
      productId
    ) {

      window.location.href =
        "product.html?product=" +
        encodeURIComponent(
          productId
        );

    }


    /* =====================================
       SEARCH
    ===================================== */

    function renderSearchResults(
      query
    ) {

      const results =
        document.getElementById(
          "searchResults"
        );


      const q =
        query
          .trim()
          .toLowerCase();


      if (!q) {

        results.innerHTML =
          "";

        return;

      }


      const matches =
        products

          .filter(
            function(product) {

              return (

                String(
                  product.name ||
                  ""
                )
                .toLowerCase()
                .includes(q)

                ||

                String(
                  product.category ||
                  ""
                )
                .toLowerCase()
                .includes(q)

              );

            }
          )

          .slice(
            0,
            8
          );


      if (
        matches.length === 0
      ) {

        results.innerHTML = `

          <div class="no-results">

            No matching product found.

          </div>

        `;

        return;

      }


      results.innerHTML =
        matches

          .map(
            function(product) {

              return `

                <button
                  type="button"
                  class="search-result"
                  onclick="openProduct(
                    '${escapeJs(
                      product.id
                    )}'
                  )">


                  <span
                    class="search-result-name">

                    ${escapeHtml(
                      product.name
                    )}

                  </span>


                  <span
                    class="search-result-cat">

                    ${escapeHtml(
                      product.category
                    )}

                  </span>


                </button>

              `;

            }
          )

          .join("");

    }


    /* =====================================
       SEARCH ELEMENTS
    ===================================== */

    const searchBtn =
      document.getElementById(
        "searchBtn"
      );


    const searchPanel =
      document.getElementById(
        "searchPanel"
      );


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    searchBtn.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();


        searchPanel
          .classList
          .toggle("active");


        document
          .getElementById(
            "categoryDropdown"
          )
          .classList
          .remove("active");


        document
          .getElementById(
            "mobileCategoryMenu"
          )
          .classList
          .remove("active");


        if (
          searchPanel
            .classList
            .contains("active")
        ) {

          searchInput.focus();

        }

      }
    );


    searchInput.addEventListener(
      "input",
      function() {

        renderSearchResults(
          searchInput.value
        );

      }
    );


    searchPanel.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

      }
    );


    /* =====================================
       DESKTOP CATEGORY
    ===================================== */

    document
      .getElementById(
        "productsMenuBtn"
      )
      .addEventListener(
        "click",
        function(event) {

          event.stopPropagation();


          document
            .getElementById(
              "categoryDropdown"
            )
            .classList
            .toggle("active");


          document
            .getElementById(
              "mobileCategoryMenu"

            .remove("active");


          searchPanel
            .classList
            .remove("active");

        }
      );


    /* =====================================

    document

        "click",

          event.stopPropagation();

    ===================================== */

        document
          .getElementById(
            "categoryDropdown"

          .classList
          .remove("active");


        document

            "mobileCategoryMenu"

          .classList
          .remove("active");


        searchPanel
          .classList
          .remove("active");

      }
    );


    /* =====================================
       CART
    ===================================== */

    function getCart() {

      try {

        return (
          JSON.parse(
            localStorage.getItem(
              "craftioCart"
            )
          ) || []
        );

      } catch (error) {

        return [];

      }

    }


    function saveCart(
      cart
    ) {

      localStorage.setItem(
        "craftioCart",
        JSON.stringify(
          cart
        )
      );

    }


    function addToCart(
      productId
    ) {

      const cart =
        getCart();


      const product =
        products.find(
          function(item) {

            return (
              item.id ===
              productId
            );

          }
        );


      if (!product) {
        return;
      }


      const existing =
        cart.find(
          function(item) {

            return (
              item.id ===
              productId
            );

          }
        );


      if (existing) {

        existing.quantity =
          Number(
            existing.quantity || 0
          ) + 1;

      } else {

        cart.push({

          id:
            productId,

          quantity:
            1

        });

      }


      saveCart(cart);

      updateCartCount();

      renderCart();

      openCart();

    }


    function updateCartCount() {

      const count =
        getCart().reduce(
          function(total, item) {

            return (

              total +

              (
                Number(
                  item.quantity
                ) || 0
              )

            );

          },
          0
        );


      document
        .getElementById(
          "cartCount"
        )
        .textContent =
          count;

    }


    function changeQuantity(
      productId,
      change
    ) {

      const cart =
        getCart();


      const item =
        cart.find(
          function(cartItem) {

            return (
              cartItem.id ===
              productId
            );

          }
        );


      if (!item) {
        return;
      }


      item.quantity =
        Number(
          item.quantity || 0
        ) + change;


      if (
        item.quantity <= 0
      ) {

        const index =
          cart.findIndex(
            function(cartItem) {

              return (
                cartItem.id ===
                productId
              );

            }
          );


        cart.splice(
          index,
          1
        );

      }


      saveCart(cart);

      updateCartCount();

      renderCart();

    }


    function removeFromCart(
      productId
    ) {

      const cart =
        getCart().filter(
          function(item) {

            return (
              item.id !==
              productId
            );

          }
        );


      saveCart(cart);

      updateCartCount();

      renderCart();

    }


    function renderCart() {

      const cart =
        getCart();


      const itemsBox =
        document.getElementById(
          "cartItems"
        );


      const totalBox =
        document.getElementById(
          "cartTotal"
        );


      if (
        cart.length === 0
      ) {

        itemsBox.innerHTML = `

          <div class="empty-cart">

            Your cart is empty.

          </div>

        `;


        totalBox.textContent =
          "Rs. 0";


        return;

      }


      itemsBox.innerHTML =
        "";


      let total = 0;

      let validItems = 0;


      cart.forEach(
        function(item) {

          const product =
            products.find(
              function(p) {

                return (
                  p.id ===
                  item.id
                );

              }
            );


          if (!product) {
            return;
          }


          validItems++;


          const quantity =
            Number(
              item.quantity || 1
            );


          const actualPrice =
            getProductPrice(
              product
            );


          if (actualPrice > 0) {

            total +=
              actualPrice *
              quantity;

          }


          const itemPrice =
            actualPrice > 0

              ?

              "Rs. " +
              (
                actualPrice *
                quantity
              ).toLocaleString()

              :

              "Price to be confirmed";


          itemsBox.innerHTML += `

            <div class="cart-item">


              <img
                src="${imageUrl(
                  product.image_url
                )}"
                alt="${escapeHtml(
                  product.name
                )}">


              <div
                class="cart-item-details">


                <h4>

                  ${escapeHtml(
                    product.name
                  )}

                </h4>


                <div
                  class="cart-item-price">

                  ${itemPrice}

                </div>


                <div
                  class="quantity-controls">


                  <button
                    type="button"
                    onclick="changeQuantity(
                      '${escapeJs(
                        product.id
                      )}',
                      -1
                    )">

                    −

                  </button>


                  <span>

                    ${quantity}

                  </span>


                  <button
                    type="button"
                    onclick="changeQuantity(
                      '${escapeJs(
                        product.id
                      )}',
                      1
                    )">

                    +

                  </button>


                </div>


                <button
                  type="button"
                  class="remove-btn"
                  onclick="removeFromCart(
                    '${escapeJs(
                      product.id
                    )}'
                  )">

                  Remove

                </button>


              </div>


            </div>

          `;

        }
      );


      if (
        validItems === 0
      ) {

        saveCart([]);


        itemsBox.innerHTML = `

          <div class="empty-cart">

            Your cart is empty.

          </div>

        `;


        totalBox.textContent =
          "Rs. 0";


        updateCartCount();


        return;

      }


      if (
        total > 0
      ) {

        totalBox.textContent =
          "Rs. " +
          total.toLocaleString();

      } else {

        totalBox.textContent =
          "Price to be confirmed";

      }

    }


    function openCart() {

      document
        .getElementById(
          "cartOverlay"
        )
        .classList
        .add("active");


      renderCart();

    }


    function closeCart() {

      document
        .getElementById(
          "cartOverlay"
        )
        .classList
        .remove("active");

    }


    /* =====================================
       ESCAPE HTML
    ===================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

    }


    function escapeJs(
      value
    ) {

      return String(
        value ?? ""
      )

      .replace(
        /\\/g,
        "\\\\"
      )

      .replace(
        /'/g,
        "\\'"
      )

      .replace(
        /\r/g,
        "\\r"
      )

      .replace(
        /\n/g,
        "\\n"
      )

      .replace(
        /\u2028/g,
        "\\u2028"
      )

      .replace(
        /\u2029/g,
        "\\u2029"
      );

    }


    /* =====================================
       LOAD CATEGORIES FROM SUPABASE
    ===================================== */

    async function loadCategories() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient

            .from("categories")

            .select("name")

            .eq(
              "active",
              true
            )

            .order(
              "created_at",
              {
                ascending: true
              }
            );


        if (error) {

          console.error(
            "Categories load error:",
            error
          );

          categories = [
            ...defaultCategories
          ];

        } else {

          const loadedCategories =
            (data || [])
              .map(
                function(item) {

                  return String(
                    item.name ||
                    ""
                  ).trim();

                }
              )
              .filter(
                function(name) {

                  return !!name;

                }
              );


          categories =
            loadedCategories.length > 0
              ? loadedCategories
              : [...defaultCategories];

        }


      } catch (error) {

        console.error(
          "Categories error:",
          error
        );

        categories = [
          ...defaultCategories
        ];

      }


      populateCategoryMenus();

      renderProducts();

    }


    /* =====================================
       START
    ===================================== */

    populateCategoryMenus();

    loadProducts();

    loadCategories();


  </script>
