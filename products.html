<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products | Craftio Gifts</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    a {
      text-decoration: none;
    }

    /* =========================
       NAVBAR
    ========================= */

    nav {
      background: #111;
      color: #fff;
      padding: 17px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1200;
      gap: 20px;
    }

    .logo-link {
      display: inline-block;
      color: #fff;
    }

    .logo-text {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .logo-text span {
      color: #00aef0;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a,
    .products-menu-btn {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      background: none;
      border: 0;
      cursor: pointer;
    }

    .nav-links a:hover,
    .products-menu-btn:hover {
      color: #00aef0;
    }

    /* =========================
       DESKTOP CATEGORY MENU
    ========================= */

    .products-menu {
      position: relative;
    }

    .category-dropdown {
      position: absolute;
      right: 0;
      top: 38px;
      width: 310px;
      max-height: 70vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.18);
      padding: 10px;
      display: none;
      border: 1px solid #eee;
    }

    .category-dropdown.active {
      display: block;
    }

    .category-dropdown a {
      display: block;
      padding: 11px 12px;
      border-radius: 8px;
      color: #111;
      font-size: 13px;
      font-weight: 700;
    }

    .category-dropdown a:hover {
      background: #eefaff;
      color: #0099d4;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-wrap {
      position: relative;
    }

    .search-btn {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 50%;
      background: #181818;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .search-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .search-panel {
      position: absolute;
      right: 0;
      top: 47px;
      width: 330px;
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.18);
      display: none;
      border: 1px solid #eee;
    }

    .search-panel.active {
      display: block;
    }

    .search-input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    .search-input:focus {
      border-color: #00aef0;
    }

    .search-results {
      margin-top: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .search-result {
      width: 100%;
      text-align: left;
      border: 0;
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .search-result:hover {
      background: #f4fbff;
    }

    .search-result-name {
      font-size: 13px;
      font-weight: 700;
      color: #111;
    }

    .search-result-cat {
      font-size: 11px;
      color: #777;
      white-space: nowrap;
    }

    .no-results {
      padding: 12px 8px;
      color: #777;
      font-size: 13px;
    }

    /* =========================
       CART BUTTON
    ========================= */

    .cart-button {
      background: #00aef0 !important;
      padding: 9px 13px;
      border-radius: 8px;
    }

    .cart-button:hover {
      color: #fff !important;
      background: #008fc5 !important;
    }

    /* =========================
       MOBILE MENU BUTTON
    ========================= */

    .mobile-menu-btn {
      display: none;
    }

    /* =========================
       PAGE HEADER
    ========================= */

    .page-header {
      text-align: center;
      padding: 58px 20px 30px;
    }

    .page-header h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .page-header p {
      color: #666;
      font-size: 17px;
    }

    .active-category {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 13px;
      border-radius: 999px;
      background: #e9f8ff;
      color: #008fc5;
      font-size: 12px;
      font-weight: 800;
    }

    /* =========================
       PRODUCTS GRID
    ========================= */

    .products-grid {
      max-width: 1200px;
      margin: 20px auto 70px;
      padding: 0 25px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
      align-items: stretch;
    }

    .product-card {
      background: #fff;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      transition: 0.25s;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card img {
      width: 100%;
      height: 260px;
      object-fit: contain;
      display: block;
      background: #fff;
      padding: 8px;
      flex-shrink: 0;
    }

    .product-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 178px;
    }

    .product-info h3 {
      font-size: 17px;
      line-height: 1.4;
      font-weight: 700;
      margin-bottom: 11px;
    }

    .product-price {
      color: #00aef0;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .price-note {
      color: #777;
      font-size: 13px;
      font-weight: 700;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .view-btn,
    .cart-btn {
      flex: 1;
      padding: 11px 8px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
    }

    .view-btn {
      background: #111;
      color: #fff;
    }

    .view-btn:hover {
      background: #333;
    }

    .cart-btn {
      background: #00aef0;
      color: #fff;
    }

    .cart-btn:hover {
      background: #008fc5;
    }

    .empty-category {
      grid-column: 1 / -1;
      text-align: center;
      background: #fff;
      border-radius: 15px;
      padding: 60px 20px;
      color: #777;
      box-shadow: 0 8px 25px rgba(0,0,0,0.05);
    }

    /* =========================
       CART
    ========================= */

    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      justify-content: flex-end;
      z-index: 3000;
    }

    .cart-overlay.active {
      display: flex;
    }

    .cart-panel {
      width: 420px;
      max-width: 100%;
      height: 100%;
      background: #fff;
      padding: 25px;
      overflow-y: auto;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .cart-header h2 {
      font-size: 27px;
    }

    .close-cart {
      border: 0;
      background: none;
      font-size: 30px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #eee;
      flex-shrink: 0;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-details h4 {
      font-size: 13px;
      margin-bottom: 7px;
      line-height: 1.35;
    }

    .cart-item-price {
      color: #00aef0;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity-controls button {
      width: 28px;
      height: 28px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 5px;
      cursor: pointer;
    }

    .remove-btn {
      margin-top: 7px;
      border: 0;
      background: none;
      color: #e33;
      cursor: pointer;
      font-size: 12px;
    }

    .cart-total {
      margin-top: 25px;
      font-size: 21px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .checkout-btn {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 8px;
      background: #00aef0;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background: #008fc5;
    }

    .empty-cart {
      text-align: center;
      color: #777;
      padding: 50px 10px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 25px;
      font-size: 14px;
    }

    footer strong {
      color: #00aef0;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1000px) {

      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }

    }

    @media (max-width: 750px) {

      nav {
        padding: 14px 18px;
      }

      .nav-links {
        display: none;
      }

      .mobile-menu-btn {
        display: flex;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(255,255,255,0.22);
        border-radius: 9px;
        background: #181818;
        color: #fff;
        align-items: center;
        justify-content: center;
        font-size: 23px;
        cursor: pointer;
      }

      .nav-right {
        gap: 8px;
      }

      .mobile-category-menu {
        position: absolute;
        right: 18px;
        top: 59px;
        width: 300px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 15px 45px rgba(0,0,0,0.18);
        padding: 10px;
        display: none;
        max-height: 75vh;
        overflow-y: auto;
      }

      .mobile-category-menu.active {
        display: block;
      }

      .mobile-category-menu a {
        display: block;
        padding: 11px 12px;
        border-radius: 8px;
        color: #111;
        font-size: 13px;
        font-weight: 700;
      }

      .mobile-category-menu a:hover {
        background: #eefaff;
        color: #0099d4;
      }

      .category-dropdown {
        display: none !important;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        padding: 0 14px;
      }

      .product-card img {
        height: 230px;
      }

      .product-info {
        padding: 14px;
        min-height: 170px;
      }

      .product-info h3 {
        font-size: 15px;
      }

      .view-btn,
      .cart-btn {
        font-size: 11px;
        padding: 10px 6px;
      }

    }

    @media (max-width: 500px) {

      .logo-text {
        font-size: 20px;
      }

      .page-header {
        padding: 40px 15px 24px;
      }

      .page-header h1 {
        font-size: 31px;
      }

      .page-header p {
        font-size: 15px;
        line-height: 1.5;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        padding: 0 10px;
        gap: 10px;
      }

      .product-card img {
        height: 185px;
        padding: 5px;
      }

      .product-info {
        padding: 11px;
        min-height: 155px;
      }

      .product-info h3 {
        font-size: 13px;
        line-height: 1.35;
        margin-bottom: 8px;
      }

      .product-price {
        font-size: 16px;
        margin-bottom: 10px;
      }

      .product-actions {
        gap: 5px;
      }

      .view-btn,
      .cart-btn {
        font-size: 9.5px;
        padding: 9px 4px;
      }

      .search-panel {
        position: fixed;
        left: 10px;
        right: 10px;
        top: 66px;
        width: auto;
      }

      .cart-panel {
        padding: 18px;
      }

    }

  </style>

</head>

  ========================= -->

  ========================= -->

      <div class="cart-header">

        <h2>
          Your Cart
        </h2>

        <button
          class="close-cart"
          type="button"

      <div class="cart-total">

      </div>

      <button
        class="checkout-btn"
        type="button"
        onclick="window.location.href='checkout.html'">

    </div>

    /* =========================
       IMAGE URL
    ========================= */

    function imageSrc(fileName) {

      return encodeURI(fileName);

    }


    /* =========================
       CATEGORY URL
    ========================= */

    function categoryUrl(category) {

      return "products.html?category=" +
        encodeURIComponent(category);

    }


    /* =========================
       GET SELECTED CATEGORY
    ========================= */

    function getSelectedCategory() {

      const value =
        new URLSearchParams(window.location.search)
          .get("category");

      return value || "ALL";

    }


    /* =========================
       CATEGORY MENUS
    ========================= */

    function populateCategoryMenus() {

      const desktop =
        document.getElementById("categoryDropdown");

      const mobile =
        document.getElementById("mobileCategoryMenu");

      const allLink =
        `<a href="${categoryUrl("ALL")}">ALL PRODUCTS</a>`;

      const links =
        categories
          .map(category =>
            `<a href="${categoryUrl(category)}">${category}</a>`
          )
          .join("");

      desktop.innerHTML =
        allLink + links;

      mobile.innerHTML =
        allLink + links;

    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts() {

      const selected =
        getSelectedCategory();

      const grid =
        document.getElementById("productsGrid");

      const label =
        document.getElementById("activeCategoryLabel");

      const visible =
        selected === "ALL"
          ? products
          : products.filter(
              product =>
                product.category === selected
            );

      label.textContent =
        selected === "ALL"
          ? "ALL PRODUCTS"
          : selected;

      if (!visible.length) {

        grid.innerHTML = `
          <div class="empty-category">
            No products have been added in
            <strong>${selected}</strong>
            yet.
          </div>
        `;

        return;

      }


      grid.innerHTML =
        visible
          .map(product => `

            <div class="product-card">

              <img
                src="${imageSrc(product.image)}"
                alt="${product.name}"
                loading="lazy"
              >

              <div class="product-info">

                <h3>
                  ${product.name}
                </h3>

                <div class="product-price">
                  <span class="price-note">
                    Price will be updated
                  </span>
                </div>

                <div class="product-actions">

                  <button
                    class="view-btn"
                    type="button"
                    onclick="openProduct('${product.id}')">

                    VIEW PRODUCT

                  </button>

                  <button
                    class="cart-btn"
                    type="button"
                    onclick="addToCart('${product.id}')">

                    🛒 ADD

                  </button>

                </div>

              </div>

            </div>

          `)
          .join("");

    }


    /* =========================
       OPEN PRODUCT
    ========================= */

    function openProduct(productId) {

      window.location.href =
        "product.html?product=" +
        encodeURIComponent(productId);

    }


    /* =========================
       SEARCH
    ========================= */

    const searchBtn =
      document.getElementById("searchBtn");

    const searchPanel =
      document.getElementById("searchPanel");

    const searchInput =
      document.getElementById("searchInput");

    const searchResults =
      document.getElementById("searchResults");


    function renderSearchResults(query) {

      const q =
        query.trim().toLowerCase();

      if (!q) {

        searchResults.innerHTML = "";

        return;

      }


      const matches =
        products
          .filter(product =>

            product.name
              .toLowerCase()
              .includes(q)

            ||

            product.category
              .toLowerCase()
              .includes(q)

          )
          .slice(0, 8);


      if (!matches.length) {

        searchResults.innerHTML =
          `<div class="no-results">
            No matching product found.
          </div>`;

        return;

      }


      searchResults.innerHTML =
        matches
          .map(product => `

            <button
              class="search-result"
              type="button"
              onclick="openProduct('${product.id}')">

              <span class="search-result-name">
                ${product.name}
              </span>

              <span class="search-result-cat">
                ${product.category}
              </span>

            </button>

          `)
          .join("");

    }


    searchBtn.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        searchPanel
          .classList
          .toggle("active");

        document
          .getElementById("categoryDropdown")
          .classList
          .remove("active");

        if (
          searchPanel
            .classList
            .contains("active")
        ) {

          searchInput.focus();

        }

      }
    );


    searchInput.addEventListener(

      () =>

    /* =========================
       CART
    ========================= */

    function getCart() {

      try {

        return JSON.parse(
          localStorage.getItem(
            "craftioCart"
          )
        ) || [];

      } catch (error) {

        return [];

      }

    }


    function saveCart(cart) {

      localStorage.setItem(
        "craftioCart",
        JSON.stringify(cart)
      );

    }


    function addToCart(productId) {

      const cart =
        getCart();

      const existing =
        cart.find(
          item =>
            item.id === productId
        );


      if (existing) {

        existing.quantity += 1;

      } else {

        cart.push({
          id: productId,
          quantity: 1
        });

      }


      saveCart(cart);

      updateCartCount();

      renderCart();

      openCart();

    }


    function updateCartCount() {

      const count =
        getCart().reduce(
          (sum, item) =>
            sum +
            (Number(item.quantity) || 0),
          0
        );


      document
        .getElementById("cartCount")
        .textContent = count;

    }


    function changeQuantity(
      productId,
      change
    ) {

      const cart =
        getCart();

      const item =
        cart.find(
          i =>
            i.id === productId
        );


      if (!item) return;


      item.quantity += change;


      if (item.quantity <= 0) {

        const index =
          cart.findIndex(
            i =>
              i.id === productId
          );

        cart.splice(
          index,
          1
        );

      }


      saveCart(cart);

      updateCartCount();

      renderCart();

    }


    function removeFromCart(
      productId
    ) {

      const cart =
        getCart().filter(
          item =>
            item.id !== productId
        );


      saveCart(cart);

      updateCartCount();

      renderCart();

    }


    function renderCart() {

      const cart =
        getCart();

      const itemsBox =
        document.getElementById(
          "cartItems"
        );

      const totalBox =
        document.getElementById(
          "cartTotal"
        );


      if (!cart.length) {

        itemsBox.innerHTML = `
          <div class="empty-cart">
            Your cart is empty.
          </div>
        `;

        totalBox.textContent =
          "Rs. 0";

        return;

      }


      itemsBox.innerHTML = "";

      let hasUnpriced = false;


      cart.forEach(item => {

        const product =
          products.find(
            p =>
              p.id === item.id
          );


        if (!product) return;


        hasUnpriced = true;


        itemsBox.innerHTML += `

          <div class="cart-item">

            <img
              src="${imageSrc(product.image)}"
              alt="${product.name}"
            >

            <div class="cart-item-details">

              <h4>
                ${product.name}
              </h4>

              <div class="cart-item-price">
                Price will be updated
              </div>

              <div class="quantity-controls">

                <button
                  type="button"
                  onclick="changeQuantity('${product.id}', -1)">
                  −
                </button>

                <span>
                  ${item.quantity}
                </span>

                <button
                  type="button"
                  onclick="changeQuantity('${product.id}', 1)">
                  +
                </button>

              </div>

              <button
                class="remove-btn"
                type="button"
                onclick="removeFromCart('${product.id}')">
                Remove
              </button>

            </div>

          </div>

        `;

      });


      totalBox.textContent =
        hasUnpriced
          ? "Price to be confirmed"
          : "Rs. 0";

    }


    function openCart() {

      document
        .getElementById("cartOverlay")
        .classList
        .add("active");

      renderCart();

    }


    function closeCart() {

      document
        .getElementById("cartOverlay")
        .classList
        .remove("active");

    }


    /* =========================
       START
    ========================= */

    populateCategoryMenus();

    renderProducts();

    updateCartCount();

    renderCart();

  </script>
